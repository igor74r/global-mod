gov_postapocalypse:0 "Постапокалиптическое правительство"
gov_postapocalypse_desc:0 "Некогда процветающая страна исчезла в ядерном пламени. Теперь выжившие пытаются построить жизнь среди пепла и руин. Традиционная административная система рухнула, а вооружённые группировки, управляющие отдельными регионами, объединились в рыхлый союз, заменивший прежнее правительство. Промышленность в основном милитаризирована, коммуникационные сети разрушены, а власть всё чаще опирается на силу."
