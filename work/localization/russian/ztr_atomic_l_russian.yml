demand_nuclear_weapons_removal_desc:0 "Это дипломатическое действие позволяет инициатору потребовать, чтобы получатель вывел ядерное оружие со своей территории, иначе инициатор установит над ним зависимость."
demand_nuclear_weapons_removal_proposal_notification_name:0 "Ядерное разоружение государства [TARGET_COUNTRY.GetName]"
demand_nuclear_weapons_removal_proposal_notification_desc:0 "[INITIATOR_COUNTRY.GetName] требует, чтобы [TARGET_COUNTRY.GetName] вывела всё ядерное оружие со своей территории как минимум на 10 лет. В противном случае будет начата [concept_diplomatic_play] с целью превращения [TARGET_COUNTRY.GetName] в марионетку."
demand_nuclear_weapons_removal_proposal_notification_effects_desc:0 "[TARGET_COUNTRY.GetName] прекратит все программы ядерного вооружения и обязуется в течение следующих 10 лет не размещать ядерное оружие на своей территории."
demand_nuclear_weapons_removal_proposal_accepted_name:0 "Ядерное разоружение государства [TARGET_COUNTRY.GetAdjective]"
demand_nuclear_weapons_removal_proposal_accepted_desc:0 "[TARGET_COUNTRY.GetName] согласилась уничтожить весь свой ядерный арсенал и обязалась в течение следующих 10 лет не размещать ядерное оружие на своей территории."
demand_nuclear_weapons_removal_proposal_declined_name:0 "Требование о ядерном разоружении отклонено"
demand_nuclear_weapons_removal_proposal_declined_desc:0 "[TARGET_COUNTRY.GetName] отклонила простое требование [INITIATOR_COUNTRY.GetName] уничтожить весь ядерный арсенал и не размещать ядерное оружие на своей территории в течение следующих 10 лет. Теперь единственным способом добиться разоружения остаётся война с целью установления марионеточной зависимости."
demand_nuclear_weapons_removal_1.tt:0 "Против [SCOPE.sCountry('target_country_indy_scope').GetName] будет начата [concept_diplomatic_play] «$dp_make_puppet$»"
demand_nuclear_weapons_removal_2.tt:0 "В течение 10 лет [SCOPE.sCountry('target_country_indy_scope').GetName] будет запрещено разрешать другим странам размещать ядерное оружие на своей территории"
demand_nuclear_weapons_removal_3.tt:0 "У этого государства нет дипломатического соглашения о размещении ядерного оружия с целевой страной"
demand_nuclear_weapons_removal_4.tt:0 "Иностранное враждебное государство размещает ядерное оружие на территории цели"
unprovoked_nuclear_strike_desc:0 "Это [concept_diplomatic_action] позволяет инициатору нанести ядерный удар по целевой стране."
unprovoked_nuclear_strike_action_notification_name:0 "Ядерный удар [INITIATOR_COUNTRY.GetAdjective] по государству [TARGET_COUNTRY.GetName]"
unprovoked_nuclear_strike_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] нанесла ядерный удар по государству [TARGET_COUNTRY.GetName], причинив огромный ущерб [Concept('concept_state', '$concept_states$')] страны [TARGET_COUNTRY.GetAdjective]."
unprovoked_nuclear_strike_action_notification_third_party_name:0 "Ядерный удар [INITIATOR_COUNTRY.GetAdjective] по государству [TARGET_COUNTRY.GetName]"
unprovoked_nuclear_strike_action_notification_third_party_desc:0 "[INITIATOR_COUNTRY.GetName] нанесла ядерный удар по государству [TARGET_COUNTRY.GetName], причинив огромный ущерб [Concept('concept_state', '$concept_states$')] страны [TARGET_COUNTRY.GetAdjective]."
war_nuclear_strike_desc:0 "Это [concept_diplomatic_action] позволяет инициатору нанести ядерный удар по целевой стране."
war_nuclear_strike_action_notification_name:0 "Ядерный удар [INITIATOR_COUNTRY.GetAdjective] по государству [TARGET_COUNTRY.GetName]"
war_nuclear_strike_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] нанесла ядерный удар по государству [TARGET_COUNTRY.GetName], причинив огромный ущерб [Concept('concept_state', '$concept_states$')] страны [TARGET_COUNTRY.GetAdjective]."
war_nuclear_strike_action_notification_third_party_name:0 "Ядерный удар [INITIATOR_COUNTRY.GetAdjective] по государству [TARGET_COUNTRY.GetName]"
war_nuclear_strike_action_notification_third_party_desc:0 "[INITIATOR_COUNTRY.GetName] нанесла ядерный удар по государству [TARGET_COUNTRY.GetName], причинив огромный ущерб [Concept('concept_state', '$concept_states$')] страны [TARGET_COUNTRY.GetAdjective]."
enter_into_a_white_peace.tt:0 "[SCOPE.sCountry('THIS_country_scope').GetName] заключает мир на прежних условиях с государством [SCOPE.sCountry('TARGET_country_scope').GetName]"
enter_into_a_white_peace_umbrella.tt:0 "[SCOPE.sCountry('TARGET_country_scope').GetName] заключает мир на прежних условиях с государством [SCOPE.sCountry('THIS_umbrella_country_scope').GetName]"

# Исследования, договоры и условия ядерного сдерживания
join_nuclear_non_proliferation_treaty_decision_desc:0 "Начало атомной эры принесло человечеству как огромные возможности, так и невиданные прежде опасности. Чем больше государств получают ядерное оружие, тем выше риск глобальной катастрофы. Поэтому Организация Объединённых Наций предложила Договор о нераспространении ядерного оружия (ДНЯО) — важнейшее соглашение, призванное ограничить распространение ядерного оружия, содействовать разоружению и поощрять мирное использование атомной энергии. Присоединившись к договору, наша страна встанет в один ряд с теми, кто выбирает дипломатию вместо разрушения, а сотрудничество — вместо изоляции."
leave_nuclear_non_proliferation_treaty_decision_desc:0 "Договор о нераспространении ядерного оружия (ДНЯО) был создан для предотвращения распространения ядерного оружия и содействия разоружению. Однако стало очевидно, что договор ограничивает способность нашей страны защищать себя и отстаивать суверенитет на мировой арене. Выход из ДНЯО позволит вернуть контроль над ядерной программой и обеспечить средства защиты национальных интересов в мире, где неопределённость постоянно растёт."
atomic_bomb_first_use.d:0 "Весть о невиданном разрушении облетела весь мир. Государство [SCOPE.sCountry('ztr_first_nuclear_attacker').GetName] нанесло ядерный удар по региону [SCOPE.sState('ztr_first_nuclear_state').GetName] в стране [SCOPE.sCountry('ztr_first_nuclear_defender').GetName]. Первое применение этой страшной силы в войне навсегда изменило мировой баланс сил."
gained_nuclear_capability.f:0 "Ядерный потенциал будет утрачен, если мы лишимся шахты ядерного оружия, откажемся от военного использования урана или станем зависимым государством. Для увеличения силы ядерного удара шахтам необходимы персонал и поставки."
je_develop_nuclear_weapons_1.tt:0 "Имеется как минимум одна завершённая шахта ядерного оружия с персоналом и без дефицита товаров"
je_develop_nuclear_weapons_2.tt:0 "Исследования не приостановлены из-за ДНЯО, договора о заморозке ядерной программы, дефолта или отсутствия действующего исследовательского центра"
signed_NPT_1_tt:0 "Приостанавливает исследования атомного и термоядерного оружия, не обнуляя прогресс; запрещает запуск новых программ вооружения и строительство шахт, а также ограничивает первое применение ядерного оружия. Существующие арсеналы сохраняются. Выход из договора невозможен как минимум #v 10 лет#!."
signed_NPT_2_tt:0 "С момента присоединения к Договору о нераспространении ядерного оружия прошло не менее #v 10 лет#!"
has_not_signed_nuclear_non_proliferation_treaty_tt:0 "Не подписан #v Договор о нераспространении ядерного оружия#!"
ztr_research_center_project_available_tt:0 "Не ведётся другая программа исследовательского центра или строительство термоядерного реактора"
ztr_tested_nuclear_arsenal_tt:0 "Имеется проверенный испытаниями ядерный арсенал в действующей шахте с персоналом и снабжением"
ztr_nuclear_arsenal_ready:0 "Имеется независимый и действующий ядерный арсенал, готовый к применению"
ztr_has_operational_nuclear_silo:0 "Имеется действующая шахта ядерного оружия с персоналом и снабжением"
ztr_is_operational_nuclear_silo:0 "Это завершённая шахта ядерного оружия с персоналом и без дефицита товаров"
ztr_has_operational_research_center:0 "Имеется действующий исследовательский центр с персоналом и снабжением"
ztr_nuclear_research_paused:0 "Исследования ядерного оружия приостановлены"
ztr_nuclear_target_in_range:0 "Цель находится в пределах досягаемости средств доставки ядерного оружия"
ztr_nuclear_first_use_allowed:0 "Политические условия и международные договоры допускают первое применение ядерного оружия против этой страны"
ztr_can_launch_nuclear_strike:0 "Можно нанести ядерный удар по этой стране"
ztr_can_retaliate_nuclear_strike:0 "Можно ответить этой стране ядерным ударом готовым арсеналом"
ztr_can_issue_nuclear_ultimatum:0 "Можно подкрепить этот ультиматум собственным доступным ядерным арсеналом"
nuclear_attack_cooldown:0 "Перезарядка ядерного арсенала (один год)"
take_control_of_nuclear_arsenal_decision_desc:0 "Восстановить контроль над испытанным ядерным арсеналом в принадлежащей нам шахте с персоналом и снабжением. Для этого необходимы технология атомной бомбы, независимость и отсутствие обязательств по ДНЯО. Незавершённая программа или неиспытанный прототип не обеспечивают ядерный потенциал."
gained_thermonuclear_capability.option:0 "Наш ядерный арсенал стал сильнее, чем когда-либо."
station_nuclear_weapons_proposal_notification_effects_desc:0 "Каждая страна, имеющая стратегическую смежность с ядерной целью и принимающая размещённое оружие, снижает оборону этой цели на 10%. Дальность доставки всё равно требует стратегической смежности с атакующим государством или наличия действующих межконтинентальных ракет."
pause_nuclear_weapons_development_desc:0 "Государство-инициатор приостанавливает исследования атомного и термоядерного оружия на срок действия этого [concept_article], сохраняя накопленный прогресс. Собственные исследования получателя не затрагиваются."
pause_nuclear_weapons_development_effects_desc:0 "Исследования атомного и термоядерного оружия государства-инициатора приостанавливаются на время действия этого [concept_article]. Накопленный прогресс сохраняется."
pause_nuclear_weapons_development_pact_desc:0 "Государство, взявшее на себя это обязательство, приостанавливает исследования атомного и термоядерного оружия, сохраняя накопленный прогресс."
pause_nuclear_weapons_development_proposal_accepted_name:0 "Исследования ядерного оружия приостановлены"
pause_nuclear_weapons_development_proposal_accepted_desc:0 "Соглашение о приостановке ядерных исследований принято. Государство, взявшее на себя обязательство, приостанавливает программы атомного и термоядерного вооружения, сохраняя накопленный прогресс."
pause_nuclear_weapons_development_action_notification_name:0 "Исследования ядерного оружия приостановлены"
pause_nuclear_weapons_development_action_notification_desc:0 "Государство-инициатор согласилось приостановить программы атомного и термоядерного вооружения на срок действия договора."
pause_nuclear_weapons_development_proposal_notification_name:0 "Приостановить исследования ядерного оружия?"
pause_nuclear_weapons_development_proposal_notification_desc:0 "Предлагаемое соглашение приостановит исследования атомного и термоядерного оружия государства-инициатора, не обнуляя накопленный прогресс."
pause_nuclear_weapons_development_proposal_notification_effects_desc:0 "Приостанавливает исследования атомного и термоядерного оружия государства-инициатора на время действия соглашения."
pause_nuclear_weapons_development_proposal_declined_desc:0 "Предложение о приостановке ядерных исследований отклонено. Программы вооружения не будут заморожены."
nuclear_de_escalation_treaty_pact_desc:0 "Обе страны сохраняют сокращённую мощь ядерных ударов и ограничивают размещение ядерного оружия вблизи территории друг друга."
nuclear_de_escalation_treaty_proposal_accepted_name:0 "Договор о ядерной деэскалации заключён"
nuclear_de_escalation_treaty_proposal_declined_desc:0 "[TARGET_COUNTRY.GetName] отклонила предложение сократить мощь ядерных ударов и ограничить размещение ядерного оружия."
nuclear_ultimatum_white_peace_action_notification_desc:0 "Ядерный ультиматум привёл к обмену ядерными ударами. Ущерб зависит от действующих арсеналов, национальной обороны и дальности доставки."
nuclear_ultimatum_white_peace_desc:0 "Потребовать прекращения войны на прежних условиях, подкрепив требование собственным ядерным арсеналом или арсеналом союзника, участвующего в той же войне. Отказ может привести к ударам по противостоящей коалиции и ответным действиям государств с готовыми арсеналами."
nuclear_ultimatum_white_peace_proposal_notification_effects_desc:0 "Отказ может привести к обмену ядерными ударами между участниками войны. Ответный удар возможен только при наличии действующего арсенала, который не находится на перезарядке и способен достичь цели."
nuclear_dev_cost:0 "Стоимость разработки ядерного оружия"
hydrogen_bomb_desc:0 "Термоядерное оружие, также известное как водородная бомба, представляет собой вершину развития ядерных технологий. В отличие от атомных бомб, основанных исключительно на делении ядер, термоядерные боеприпасы используют двухступенчатый процесс, сочетающий деление и синтез. Первичный ядерный взрыв создаёт экстремальные температуру и давление, необходимые для запуска синтеза изотопов водорода. В результате возникает взрыв, мощность которого намного превосходит мощность обычной атомной бомбы. Создание термоядерного оружия радикально изменило стратегический баланс сил и добавило новые вызовы в области сдерживания, обороны и международных отношений."
nuclear_reactor_purchase_cost:0 "Лицензирование ядерного реактора"
je_develop_nuclear_weapons_reason:0 "Создать независимый потенциал #v ядерного вооружения#!: набрать #v 1500#! очков исследований, изучить #v $atomic_bomb$#! и обеспечить работу укомплектованной персоналом и снабжаемой шахты #v $building_nuclear_weapons_silo$#!.\n\nЕжемесячный прогресс равен нашей [concept_research_capacity] минус 5, но не может быть меньше 1. Во время войны или при наличии ядерной державы-соперника скорость прогресса удваивается; до изучения #v $atomic_bomb$#! она делится на #v 3#!. Прогресс не превысит #v 80%#!, пока не выполнены все остальные условия. ДНЯО, договор о приостановке программы, дефолт или потеря действующего исследовательского центра замораживают прогресс, но не обнуляют его."
je_develop_thermonuclear_weapons_reason:0 "Создать #v термоядерное оружие#!: набрать #v 2000#! очков исследований и изучить #v $second_nuclear_reactor$#!.\n\nЕжемесячный прогресс равен нашей [concept_research_capacity] минус 5, но не может быть меньше 1. Во время войны или при наличии термоядерной державы-соперника скорость прогресса утраивается; до изучения #v $second_nuclear_reactor$#! она делится на #v 3#!. Прогресс не превысит #v 80%#!, пока не выполнены все остальные условия. ДНЯО, договор о приостановке программы, дефолт или потеря действующего исследовательского центра замораживают прогресс, но не обнуляют его. Для продолжения программы необходимо сохранить ядерный потенциал."
je_nuclear_weapons_info_panel_reason:0 "После открытия #i атомной бомбы#! государством [SCOPE.sCountry('first_nuclear_country').GetName] [Concept('concept_great_power', '$concept_great_powers$')] мира начали гонку за создание и расширение собственных ядерных арсеналов, стремясь сохранить баланс сил и удержать потенциальных противников от ядерного нападения. Это привело к опасному обострению международной напряжённости: каждая сторона пытается превзойти соперников по ядерному потенциалу.\n\nНачался #V #i атомный век#!#!, а вместе с ним появилась угроза взаимного гарантированного уничтожения.\n\n#v РЕЙТИНГ МОЩНОСТИ ЯДЕРНОГО УДАРА#! @nuclear_icon!: \n[GetScriptedGui('ztr_nuclear_power_ranking_sgui').ExecuteTooltip(GuiScope.SetRoot(SCOPE.GetRootScope.GetCountry.MakeScope).End)]\n\n#v РЕЙТИНГ ПРОТИВОЯДЕРНОЙ ОБОРОНЫ#! @nuclear_icon!: \n[GetScriptedGui('ztr_nuclear_defence_ranking_sgui').ExecuteTooltip(GuiScope.SetRoot(SCOPE.GetRootScope.GetCountry.MakeScope).End)]"
ZTR_NUCLEAR_POWER_RANK_ENTRY:0 "[THIS.GetCountry.MakeScope.Var('ztr_nuclear_power_rank_var').GetValue|0]. [THIS.GetCountry.GetName]: [THIS.GetCountry.MakeScope.Var('nuclear_strike_power_display').GetValue|0]"
ZTR_NUCLEAR_DEFENCE_RANK_ENTRY:0 "[THIS.GetCountry.MakeScope.Var('ztr_nuclear_defence_rank_var').GetValue|0]. [THIS.GetCountry.GetName]: [THIS.GetCountry.MakeScope.Var('nuclear_strike_defence_display').GetValue|0]"
nuclear_de_escalation_treaty_desc:0 "Обе страны сокращают эффективную мощь своих ядерных ударов до одной трети и обязуются не размещать оружие в государствах, стратегически граничащих с другой стороной. После выхода из договора мощь ядерных ударов покинувшей его страны остаётся сниженной ещё пять лет."
nuclear_de_escalation_treaty_effects_desc:0 "Мощь ядерных ударов обеих стран сокращается до #v одной трети#! на время действия договора. После выхода из него мощь ядерных ударов покинувшей договор страны остаётся сниженной ещё #v 5 лет#!. Размещение ядерного оружия вблизи другой стороны ограничивается."
nuclear_de_escalation_treaty_proposal_accepted_desc:0 "[INITIATOR_COUNTRY.GetName] и [TARGET_COUNTRY.GetName] согласились сократить мощь ядерных ударов до одной трети и ограничить размещение ядерного оружия вблизи друг друга."
nuclear_de_escalation_treaty_proposal_notification_desc:0 "[INITIATOR_COUNTRY.GetName] и [TARGET_COUNTRY.GetName] сократят мощь ядерных ударов до одной трети и ограничат размещение ядерного оружия вблизи друг друга."
nuclear_de_escalation_treaty_proposal_notification_effects_desc:0 "Сокращает эффективную мощь ядерных ударов обеих стран до одной трети. После выхода из договора мощь покинувшей его страны остаётся сниженной ещё пять лет."
