develop_thermonuclear_weapons_decision:0 "#n Программа термоядерного вооружения#!"
develop_thermonuclear_weapons_decision_desc:0 "Мы уже стали ядерной державой, но для подлинного господства на мировой арене нам необходимо создать более мощное оружие на основе ядерного синтеза — термоядерную бомбу. Её разрушительная сила значительно превзойдёт возможности нынешних атомных бомб и укрепит наше положение ведущей сверхдержавы."
