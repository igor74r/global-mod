start_nuclear_weapons_program_decision:0 "#n Программа ядерного вооружения#!"
start_nuclear_weapons_program_decision_desc:0 "Ядерное оружие — это взрывное устройство, разрушительная сила которого основана на ядерных реакциях: делении атомных ядер или сочетании деления и синтеза в термоядерном боеприпасе. Нам следует создать такое оружие, чтобы внушить страх нашим врагам. Учтите: программа будет прекращена, если мы станем недостаточно самостоятельным субъектом или примем законы, запрещающие владение оружием массового уничтожения."
nuclear_program_started:0 "Программа ядерного вооружения начата"
gained_nuclear_capability_first.t:0 "Оружие, которое изменит мир"
gained_nuclear_capability_first.d:0 "У нас получилось! Последние испытания превзошли все ожидания, и теперь мы — первая страна, сумевшая создать и испытать ядерное оружие. Это грандиозное достижение открывает новую эпоху в военном деле и мировой политике: теперь в наших руках оружие чудовищной, не имеющей равных разрушительной силы. Сегодня наши знамёна реют выше, а страна ощущает себя могущественнее. Но будущее рассудит, использовали ли мы этот огонь ради безопасности или ради новых трагедий."
gained_nuclear_capability_first.option:0 "'Теперь я стал Смертью, разрушителем миров.'\n — Дж. Роберт Оппенгеймер"
gained_nuclear_capability.t:0 "Место среди ядерных держав"
gained_nuclear_capability.d:0 "Последние успешные испытания позволили нам получить ядерное оружие и средства его доставки к противнику. Теперь мы можем наносить ядерные удары по вражеским государствам, с которыми находимся в состоянии войны."
gained_nuclear_capability.option:0 "Мир содрогнётся от нашей мощи!"
gained_nuclear_capability_others.t:0 "Странное оружие"
gained_nuclear_capability_others.d:0 "Поступили сообщения, что государство [SCOPE.sCountry('nuclear_country').GetName] успешно создало и испытало оружие чудовищной, не имеющей равных разрушительной силы, названное «#i Атомная бомба#!». Это грандиозное достижение открывает новую эпоху в военном деле и мировой политике: теперь у [SCOPE.sCountry('nuclear_country').GetName] есть оружие, способное мгновенно уничтожать целые города. Будущее рассудит, используют ли они этот огонь ради безопасности или ради новых трагедий."
gained_nuclear_capability_others.f:0 "'Теперь я стал Смертью, разрушителем миров.'\n— Дж. Роберт Оппенгеймер"
gained_nuclear_capability_others.option:0 "Это меняет всё."
gained_nuclear_capability_others_rivals.option:0 "Мы тоже должны заполучить такую силу!"
lost_nuclear_capability.t:0 "Утрата возможности наносить ядерные удары"
lost_nuclear_capability.d:0 "Государство [SCOPE.sCountry('nuclear_country').GetName] утратило возможность наносить ядерные удары по своим врагам."
lost_nuclear_capability.f:0 "Это событие срабатывает, если у государства [SCOPE.sCountry('nuclear_country').GetName] больше нет $building_nuclear_weapons_silo$ [concept_building] или оно стало недостаточно самостоятельным субъектом."
lost_nuclear_capability.option:0 "Трагедия!"
nuclear_attack.t:0 "Ядерный удар по государству [SCOPE.sCountry('nuclear_country').GetName]"
nuclear_attack.d:0 "Поступили сообщения, что противник нанёс ядерные удары по нескольким нашим городам и поселениям. Инфраструктура поражённых районов уничтожена, а значительная часть территории опасно заражена радиацией. Большинство государственных служащих смогли укрыться в убежищах, но многие жители не успели найти защиту и погибли от взрывной волны или радиоактивных осадков. Остаётся надеяться, что мир удастся восстановить до того, как [SCOPE.sCountry('nuclear_country').GetName] будет полностью уничтожена."
nuclear_attack.f:0 "В регионах, подвергшихся ядерному удару, появятся крайне разрушительные модификаторы, которые будут постепенно ослабевать на протяжении последующих десятилетий."
nuclear_attack.option:0 "Почтим молчанием тех, кто не выжил."
atomic_bomb_first_use.t:0 "Оружие, которое изменит мир"
atomic_bomb_first_use.f:0 "Сообщения говорят об ослепительной вспышке, ревущей волне разрушений и грибовидном облаке, поднявшемся к небесам. Учёные и генералы поняли: это не просто ещё один вид оружия. Началась новая эпоха, в которой человечество способно уничтожить само себя за считаные секунды."
atomic_bomb_first_use.option:0 "Добро пожаловать в #V #i атомный век#!#!."
