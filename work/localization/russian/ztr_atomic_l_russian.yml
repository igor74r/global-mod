station_nuclear_weapons_pact_desc:0 "[SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName] размещает ядерное оружие на территории государства [SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName]. Это снижает способность соседних с принимающей страной государств защищаться от ядерного удара со стороны разместившей оружие державы."
