gained_thermonuclear_capability.d:0 "Успешное создание #V #N термоядерного оружия#!#! значительно усилило наш ядерный арсенал. Новые боеприпасы, использующие ядерный синтез, обладают куда большей разрушительной силой, чем обычные атомные бомбы. Следует ли этому радоваться или опасаться последствий?"
