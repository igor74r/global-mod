nuclear_de_escalation_treaty_action_notification_break_name:0 "Договор о ядерной деэскалации между [INITIATOR_COUNTRY.GetAdjectiveNoFlag] и [TARGET_COUNTRY.GetAdjectiveNoFlag] расторгнут"
nuclear_de_escalation_treaty_action_notification_break_desc:0 "[INITIATOR_COUNTRY.GetName] и [TARGET_COUNTRY.GetName] отказались от договора о ядерной деэскалации."
nuclear_de_escalation_treaty_trigger_desc_third:0 "[COUNTRY.GetName] и [TARGET_COUNTRY.GetName] должны сократить свои ядерные арсеналы"
nuclear_de_escalation_treaty_effect_desc_global:0 "Подписать договор о ядерной деэскалации"
nuclear_de_escalation_treaty_article_short_desc:0 "[FIRST_COUNTRY.GetNameNoFormatting] и [SECOND_COUNTRY.GetNameNoFormatting] сократят запасы ядерного оружия"
TREATY_DRAFT_ARTICLE_FLAG_IS_NUCLEAR_DE_ESCALATION_TREATY_EFFECT:0 "• [FIRST_COUNTRY.GetName] и [SECOND_COUNTRY.GetName] сократят запасы ядерного оружия"
