l_russian:

# Game concepts
concept_demographic_stages: "Этапы демографического перехода"
concept_demographic_stage: "Этап демографического перехода"


concept_environment: "Окружающая среда"
concept_environmental: "Экологический"
concept_environment_desc: "[Concept('concept_environment','$concept_environment$')] — это понятие, обозначающее природный мир and влияние человеческой деятельности на него. Оно охватывает the воздух, воду, землю и экосистемы которые поддерживают жизнь в [Concept('concept_country','$concept_country$')] и на Земле в целом. The environment необходима для выживания всех живых существ, and её состояние важно для благополучия будущих поколений. Экологические движения выступают за её защиту, сохранение и восстановление, часто выступая против индустриализации и экономического развития, наносящих ущерб природным ресурсам."

ztr_concept_colonial_state: "Колониальные штаты"
ztr_concept_colonial_states: "Колониальные штаты"
ztr_concept_colonial_state_desc: "A [Concept('concept_state','$concept_state$')] считается #v колониальным штатом#!, если он не является [Concept('concept_homeland','$concept_homeland$')] владельца [Concept('concept_country','$concept_country$')]'s [Concept('concept_culture','$concept_cultures$')], и все [Concept('concept_culture','$concept_cultures$')] коренные жители этого [Concept('concept_state','$concept_state$')] стремятся к большей #v самостоятельности#! и могут добиваться #v независимости#!.\n\nСтремление [Concept('concept_culture','$concept_culture$')] к деколонизации зависит от того, насколько [Concept('concept_democracy','$concept_democracy_adjective$')] правящее [Concept('concept_country','$concept_country$')] и насколько принята [Concept('concept_culture','$concept_culture$')] is в его составе:\n\n- #v Полные демократии#!: культуры с [Concept('concept_acceptance','$concept_acceptance$')] ниже #v 55#! стремятся к деколонизации.\n- #v Несовершенные демократии#!: культуры с [Concept('concept_acceptance','$concept_acceptance$')] ниже #v 60#! стремятся к деколонизации.\n- #v Недемократические режимы#!: культуры с [Concept('concept_acceptance','$concept_acceptance$')] ниже #v 65#! стремятся к деколонизации."
concept_decolonization: "Деколонизация"
concept_decolonization_desc: "[Concept('concept_decolonization','$concept_decolonization$')] — это процесс, связанный с политическими и общественными движениями, направленными на прекращение [Concept('concept_colony','$concept_colonial$')] правления и обретение независимости колониальными территориями. Он предполагает демонтаж [Concept('concept_colony','$concept_colonial$')] структур, утверждение права на самоопределение и восстановление местного самоуправления. Процесс [Concept('concept_decolonization','$concept_decolonization$')] может быть сложным и многогранным, часто сопровождаясь переговорами, конфликтами и переосмыслением национальной идентичности."

concept_progressivism: "Прогрессизм"
concept_progressivism_desc: "[Concept('concept_progressivism','$concept_progressivism$')] — это политическая и общественная идеология, выступающая за социальные реформы, равенство и развитие прав человека. Она подчёркивает необходимость поступательного преобразования общества, часто при участии государства, для решения проблем бедности, дискриминации и ухудшения состояния окружающей среды. Сторонники прогрессизма стремятся создать более справедливое общество, поддерживая политику в интересах уязвимых групп и одновременно способствуя инновациям и технологическому развитию."

# NEW 1.5

concept_united_nations: "Организация Объединённых Наций"

concept_liberty_index: "Индекс свободы"

concept_democracy: "Демократия"
concept_democracy_adjective: "Демократический"
concept_democracy_desc: "[Concept('concept_democracy','$concept_democracy$')] — это форма правления, при которой власть принадлежит народу напрямую или через избранных представителей. Она основана на принципах политического равенства, личных свобод и верховенства закона. In a [Concept('concept_democracy','$concept_democracy$')], граждане имеют право участвовать в принятии решений, выражать своё мнение и требовать отчётности от руководителей. Для демократий характерны регулярные выборы, свобода слова и защита прав меньшинств, благодаря чему в обществе слышны и уважаются разные мнения."

concept_autocracy: "Автократия"
concept_autocracy_adjective: "Автократический"
concept_autocracy_desc: "[Concept('concept_autocracy','$concept_autocracy$')] — это форма правления, при которой абсолютная власть сосредоточена в руках одного правителя или небольшой группы лиц. In an [Concept('concept_autocracy','$concept_autocracy$')], правящая власть бесконтрольно управляет политической, социальной и экономической жизнью общества, зачастую без согласия и участия населения. [Concept('concept_autocracy','$concept_autocracy_adjective$')] режимы могут подавлять инакомыслие, ограничивать свободы и централизовать принятие решений, что ведёт к отсутствию ответственности и возможным злоупотреблениям властью. Эта форма правления резко отличается от [Concept('concept_democracy','$concept_democracy_adjective$')] systems, where power is distributed among the people and their elected representatives."

concept_superpower: "Сверхдержава"

concept_equality_index: "Индекс равенства"
concept_equality_index_desc: "[Concept('concept_equality_index','$concept_equality_index$')] показывает уровень социального и экономического равенства в [Concept('concept_country','$concept_country$')]. Более высокий [Concept('concept_equality_index','$concept_equality_index$')] указывает на более справедливое распределение богатства, возможностей и ресурсов среди населения, тогда как низкое значение свидетельствует о значительном неравенстве и социальном расслоении. The [Concept('concept_equality_index','$concept_equality_index$')] зависит от многих факторов, включая политику государства, социальные программы и культурное отношение к равенству и справедливости."


# NEW 1.6

concept_developed_country: "Развитая страна"
concept_developed_country_short: "Развитая"
concept_developed_countries: "Развитые страны"
concept_developed_country_desc: "Страна считается [Concept('concept_developed_country','$concept_developed_country_shилиt$')] достигшей определённого уровня экономического и социального развития. К таким показателям относятся ВВП на душу населения, ожидаемая продолжительность жизни, уровень образования и индустриализация. [Concept('concept_developed_country','$concept_developed_country_shилиt$')] обычно отличаются развитой инфраструктурой, диверсифицированной экономикой и высоким уровнем жизни и благосостояния граждан."

# UN law concepts
concept_un_subject_imf: "МВФ"
concept_un_subject_wto: "ВТО"
concept_un_subject_icc: "Международный уголовный суд"
concept_un_subject_unesco: "ЮНЕСКО"









concept_research_capacity: "Изучить Capacity"
concept_research_capacities: "Изучить Capacities"

# Community mechanics explanations
concept_superpower_desc: "$concept_superpower$ — это государство, чьё экономическое, военное и дипломатическое влияние определяет мировую повестку.\n\n #b Требования#!\nИзучить [GetTechnology('neoimperialism').GetName] и занять #v 1-е или 2-е место#! в мировом рейтинге [concept_prestige] . Падение ниже 2-го места лишает страну этого статуса.\n\n#b Преимущества действующего статуса#!\n• #P +1,000#! [concept_influence]\n• #P +500%#! [concept_power_bloc_leverage] генерация\n• #P +1,000#! [concept_power_bloc_leverage] сопротивление\n• #P +1#! максимум [Concept('concept_company','$concept_companies$')]\n\nСверхдержава, возглавляющая [concept_power_bloc] должна иметь #v 50#! [concept_power_bloc_leverage_advantage] чтобы пригласить страну или принять её заявку на вступление. Этот статус также позволяет [concept_power_bloc_leader] предложить объединение блоков при соблюдении остальных требований действия." # UPDATED
 concept_un_voting: "Резолюции и голосование ООН"
 concept_un_membership: "Членство в ООН"
 concept_un_human_rights: "Стандарты ООН в области прав человека"

 concept_united_nations_desc: "The $concept_united_nations$ — международная площадка для дипломатии, обязательных стандартов в области прав человека и специализированных учреждений. Государство, занимающее #v 1-е место#! [concept_country] может учредить её начиная с #v 1945 года#! после изучения [GetTechnology('international_илиganizations').GetName].\n\nОткройте запись журнала #v «Организация Объединённых Наций»#! [concept_journal_entry] чтобы ознакомиться с Советом Безопасности, действующими правилами и учреждениями. Наведите курсор на название правила или учреждения, чтобы увидеть его варианты и эффекты.\n\n• [Concept('concept_un_membership','$concept_un_membership$')]: льготы, дипломатические издержки и изменения законов при вступлении.\n• [Concept('concept_un_voting','$concept_un_voting$')]: предложения, голосование и право вето.\n• [Concept('concept_un_human_rights','$concept_un_human_rights$')]: обязательные законодательные стандарты.\n\nУчреждения: [Concept('concept_un_subject_imf','$concept_un_subject_imf$')], [Concept('concept_un_subject_wto','$concept_un_subject_wto$')], [Concept('concept_un_subject_icc','$concept_un_subject_icc$')] and [Concept('concept_un_subject_unesco','$concept_un_subject_unesco$')]. ООН также может вмешиваться в [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')]." # UPDATED
 concept_un_voting_model: "Модель голосования"
 concept_un_voting_model_desc: "The $concept_un_voting_model$ of the [Concept('concept_united_nations','$concept_united_nations$')] определяет, какие члены могут голосовать по предложениям и какой вес имеет каждый голос. Её можно изменить посредством [Concept('concept_un_voting','$concept_un_voting$')].\n\n#b $ztr_un_law_voting_model_1$#!\n$ztr_un_law_voting_model_1_desc$\n\n#b $ztr_un_law_voting_model_2$#!\n$ztr_un_law_voting_model_2_desc$\n\n#b $ztr_un_law_voting_model_3$#!\n$ztr_un_law_voting_model_3_desc$\n\n#b $ztr_un_law_voting_model_4$#!\n$ztr_un_law_voting_model_4_desc$\n\n$ztr_un_vote_resolution_rule$"
 concept_un_veto_right: "Право вето"
 concept_un_veto_right_desc: "$concept_un_veto_right$ определяет, может ли один постоянный член Совета Безопасности заблокировать предложение [Concept('concept_united_nations','$concept_united_nations$')].\n\n#b $ztr_un_law_veto_right_enabled$#!\n$ztr_un_law_veto_right_enabled_desc$\n\n#b $ztr_un_law_veto_right_disabled$#!\n$ztr_un_law_veto_right_disabled_desc$"
 concept_un_member_selection: "Выбор постоянных членов"
 concept_un_decolonization: "Резолюция о деколонизации"
 concept_un_decolonization_desc: "The $concept_un_decolonization$ устанавливает единый стандарт [Concept('concept_united_nations','$concept_united_nations$')] в отношении законов о колониальных владениях. Как и все [Concept('concept_un_human_rights','$concept_un_human_rights$')], она обязательна для всех членов, даже голосовавших против.\n\n#b $ztr_un_vote_proposal_decolonization_encouraged$#!\n$ztr_un_vote_proposal_decolonization_encouraged_desc$\n\n#b $ztr_un_vote_proposal_decolonization_conservative$#!\n$ztr_un_vote_proposal_decolonization_conservative_desc$\n\n#b $ztr_un_vote_proposal_decolonization_neutral$#!\n$ztr_un_vote_proposal_decolonization_neutral_desc$"
 concept_un_slavery: "Резолюция о рабстве"
 concept_un_slavery_desc: "The $concept_un_slavery$ устанавливает единый стандарт [Concept('concept_united_nations','$concept_united_nations$')] в отношении законов о рабстве. Как и все [Concept('concept_un_human_rights','$concept_un_human_rights$')], она обязательна для всех членов, даже голосовавших против.\n\n#b $ztr_un_vote_proposal_slavery_illegal$#!\n$ztr_un_vote_proposal_slavery_illegal_desc$\n\n#b $ztr_un_vote_proposal_slavery_neutral$#!\n$ztr_un_vote_proposal_slavery_neutral_desc$"
 concept_un_children_rights: "Резолюция о правах детей"
 concept_un_children_rights_desc: "The $concept_un_children_rights$ устанавливает единый стандарт [Concept('concept_united_nations','$concept_united_nations$')] в отношении законов о детском труде. Как и все [Concept('concept_un_human_rights','$concept_un_human_rights$')], она обязательна для всех членов, даже голосовавших против.\n\n#b $ztr_un_vote_proposal_children_rights_negligible$#!\n$ztr_un_vote_proposal_children_rights_negligible_desc$\n\n#b $ztr_un_vote_proposal_children_rights_restricted_child_labили$#!\n$ztr_un_vote_proposal_children_rights_restricted_child_labили_desc$\n\n#b $ztr_un_vote_proposal_children_rights_compulsилиy_study$#!\n$ztr_un_vote_proposal_children_rights_compulsилиy_study_desc$"
 concept_un_women_rights: "Резолюция о правах женщин"
 concept_un_women_rights_desc: "The $concept_un_women_rights$ устанавливает единый стандарт [Concept('concept_united_nations','$concept_united_nations$')] в отношении законов о правах женщин. Как и все [Concept('concept_un_human_rights','$concept_un_human_rights$')], она обязательна для всех членов, даже голосовавших против.\n\n#b $ztr_un_vote_proposal_women_rights_negligible$#!\n$ztr_un_vote_proposal_women_rights_negligible_desc$\n\n#b $ztr_un_vote_proposal_women_rights_gender_equality$#!\n$ztr_un_vote_proposal_women_rights_gender_equality_desc$"
 concept_un_subject_wto_desc: "После создания каждый член ООН получает:
• #P +10#! $state_building_construction_sector_max_level_add$
• #P +10%#! $state_import_advantage_mult$
• #P +10%#! $state_export_advantage_mult$
• #N -5%#! $state_tariff_import_add$
• #N -5%#! $state_tariff_export_add$

Торговля становится конкурентоспособнее, но государство теряет часть таможенных доходов и защиты отечественных производителей. Эффекты действуют, пока страна остаётся членом ООН." # UPDATED
 concept_un_subject_imf_desc: "МВФ и Всемирный банк открывают доступ к адресной финансовой помощи и отдельной программе модернизации.

#b Финансовая помощь членам ООН#!
Объём помощи пересматривается #v ежегодно#! на основе текущего среднего [concept_sol]. Каждый уровень помощи снижает $country_loan_interest_rate_add$ на #P 3%#!. Остальные бонусы зависят от уровня:
• Ниже #v 6#!: #P +2#! [concept_sol], #P +600%#! $country_minting_mult$, #P +40%#! $state_construction_mult$
• #v 6–7#!: #P +1,5#! [concept_sol], #P +400%#! $country_minting_mult$, #P +40%#! $state_construction_mult$
• #v 7–8#!: #P +1#! [concept_sol], #P +250%#! $country_minting_mult$, #P +35%#! $state_construction_mult$
• #v 8–9#!: #P +0,5#! [concept_sol], #P +150%#! $country_minting_mult$, #P +25%#! $state_construction_mult$
• #v 9–10#!: #P +100%#! $country_minting_mult$, #P +15%#! $state_construction_mult$
Помощь прекращается при ежегодном пересмотре, если средний [concept_sol] достигает #v 10#!.

#b Программа модернизации#!
Независимые страны рангом не ниже [concept_minor_power] могут присоединиться, если [concept_gdp_per_capita] ниже #v 4#!, [concept_literacy] ниже #v 30%#!, а средний [concept_sol] ниже #v 9,5#!. Членство в ООН не требуется. Во время действия программа даёт #P +5%#! $country_tech_spread_mult$ и #N -5%#! [concept_bureaucracy]; её события и проекты могут повлечь дополнительные расходы. Для завершения необходимо превысить #v 35%#! [concept_literacy], #v 10#! среднего [concept_sol] и #v 5#! [concept_gdp_per_capita], чтобы получить #P +25%#! $country_tech_research_speed_mult$ на #v 25 лет#!." # UPDATED
 concept_un_environment: "Резолюция об охране окружающей среды"
 concept_un_environment_desc: "The $concept_un_environment$ устанавливает единый стандарт [Concept('concept_united_nations','$concept_united_nations$')] в отношении законов об экологической политике. Как и все [Concept('concept_un_human_rights','$concept_un_human_rights$')], она обязательна для всех членов, даже голосовавших против.\n\n#b $ztr_un_vote_proposal_environment_negligible$#!\n$ztr_un_vote_proposal_environment_negligible_desc$\n\n#b $ztr_un_vote_proposal_environment_basic_protection$#!\n$ztr_un_vote_proposal_environment_basic_protection_desc$"
 concept_un_labor_rights: "Резолюция on Labили Права"
 concept_un_labor_rights_desc: "The $concept_un_labили_rights$ устанавливает единый стандарт [Concept('concept_united_nations','$concept_united_nations$')] в отношении трудового законодательства в соответствии с конвенциями Международной организации труда. Как и все [Concept('concept_un_human_rights','$concept_un_human_rights$')], она обязательна для всех членов, даже голосовавших против.\n\n#b $ztr_un_vote_proposal_labили_rights_negligible$#!\n$ztr_un_vote_proposal_labили_rights_negligible_desc$\n\n#b $ztr_un_vote_proposal_labили_rights_regulatилиy_bodies$#!\n$ztr_un_vote_proposal_labили_rights_regulatилиy_bodies_desc$\n\n#b $ztr_un_vote_proposal_labили_rights_wилиker_protections$#!\n$ztr_un_vote_proposal_labили_rights_wилиker_protections_desc$"
 concept_political_pole: "Идеологический полюс" # UPDATED
 concept_ideology_index: "Индекс идеологии"
 concept_ideology_index_desc: "The [Concept('concept_ideology_index','$concept_ideology_index$')] of a [concept_country] combines its [Concept('concept_liberty_index','$concept_liberty_index$')] and [Concept('concept_equality_index','$concept_equality_index$')], both shaped by most of the [Concept('concept_law','$concept_laws$')] in fилиce. A [Concept('concept_democracy','$concept_democracy_adjective$')] country usually достигает более высокий показатель [Concept('concept_liberty_index','$concept_liberty_index$')], while an [Concept('concept_autocracy','$concept_autocracy_adjective$')] one restricts individual freedoms. Redistribution and social programs raise the [Concept('concept_equality_index','$concept_equality_index$')], while free-market policies accept greater economic disparities.\n\nTogether, the two indices place a country in an [Concept('concept_political_pole','$concept_political_pole$')]."
 concept_political_pole_desc: "A [Concept('concept_political_pole','$concept_political_pole$')] is the long-term political character of a [concept_country], given by its [Concept('concept_liberty_index','$concept_liberty_index$')] and [Concept('concept_equality_index','$concept_equality_index$')] together:\n\n #positive_value Social#!: democratic and egalitarian\n #blue_value Liberal#!: democratic and individualist\n #negative_value Collectivist#!: authилиitarian and egalitarian\n #gold_value Reactionary#!: authилиitarian and individualist\n\nA country is democratic from #v 50#! [Concept('concept_liberty_index','$concept_liberty_index$')] and egalitarian from #v 70#! [Concept('concept_equality_index','$concept_equality_index$')]. Once assigned, a [Concept('concept_political_pole','$concept_political_pole$')] changes only when an index moves #v 1#! point past its threshold. Countries #v 20#! points past the threshold, with a [Concept('concept_liberty_index','$concept_liberty_index$')] of at least #v 70#! или ниже #v 30#!, fилиm the #v cилиe#! of their pole.\n\nPoles emerge with the age of mass politics, once [GetTechnology('political_agitation').GetName] is researched." # UPDATED
 concept_liberty_index_desc: "[Concept('concept_liberty_index','$concept_liberty_index$')] отражает уровень личных и политических свобод граждан государства [Concept('concept_country','$concept_country$')]. Более высокий [Concept('concept_liberty_index','$concept_liberty_index$')] указывает на более открытое и [Concept('concept_democracy','$concept_democracy_adjective$')] общество, тогда как низкий индекс указывает на более [Concept('concept_autocracy','$concept_autocracy_adjective$')] режим, диктатуру или даже антиутопию. The [Concept('concept_liberty_index','$concept_liberty_index$')] зависит от большинства действующих в стране законов.\n\n#negative_value Важно#!: #gold_value Группа законов#! [GetLawGroup('lawgroup_distribution_of_power').GetName] ограничивает максимальное значение показателя [Concept('concept_liberty_index','$concept_liberty_index$')]. A [GetPlayer.GetCustom('ztrpol_single_party_law_name')] with [GetLawType('law_secret_police').GetName] and [GetLawType('law_outlawed_dissent').GetName] теряет дополнительно #negative_value 12#! пунктов; [GetLawType('law_secret_police').GetName] with [GetLawType('law_censилиship').GetName], как при однопартийной системе, так и без неё, теряет #negative_value 6#!." # UPDATED
 concept_literate_citizens: "Грамотные граждане"
 concept_research_capacity_desc: "[Concept('concept_research_capacity','$concept_research_capacity$')] показывает, какой объём научной работы [Concept('concept_country','$concept_country$')] может направлять самостоятельно, в отличие от знаний, получаемых из-за рубежа. Это темп реализации программ Национального исследовательского центра, который определяется тремя факторами:\n\n[Concept('concept_literate_citizens','$concept_literate_citizens$')], — это самый значительный вклад.\n\n#v Уровень развития страны#!.\n\n#v $ztr_research_agreement$s#!: до #v 2#! очков за каждое соглашение; меньше, если партнёр слабее или [concept_relations]. Максимум #v 6#! очков, #v 8#! with [GetTechnology('funded_research_projects').GetName].\n\nЭффект каждого очка зависит от [Concept('concept_research_philosophy','$concept_research_philosophy$')] выбранной в Национальном исследовательском центре." # UPDATED
 concept_research_philosophy: "Изучить Philosophy"
 concept_literate_citizens_desc: "[Concept('concept_literate_citizens','$concept_literate_citizens$')] — это жители [concept_country] умеющие читать и писать: общая численность [Concept('concept_pop','$concept_population$')] умножается на показатель [Concept('concept_literacy','$concept_literacy$')]. Большое образованное население позволяет поддерживать передовые академические и научные учреждения даже при низкой общей грамотности и является главным источником [Concept('concept_research_capacity','$concept_research_capacity$')]." # UPDATED
 concept_climate_stage: "Стадия изменения климата"
 concept_effective_pollution: "Фактическое загрязнение"
 concept_effective_pollution_desc: "$concept_effective_pollution$ — это объём загрязнения, который [concept_country] ежегодно выбрасывает в атмосферу и который способствует глобальному потеплению. Он равен суммарному значению [concept_generated_pollution] для всех [Concept('concept_state','$concept_states$')], за вычетом:\n\n• [GetLawType('law_basic_protection').GetName] #positive_value -5%#! или [GetLawType('law_active_restилиation').GetName] #positive_value -10%#!\n• [GetInstitutionType('institution_environmental_policy').GetName]: #positive_value -5%#! за каждый уровень, максимум #positive_value -25%#!\n• [GetLawType('law_mining_restrict_hazardous').GetName] #positive_value -2%#!, [GetLawType('law_mining_strategic').GetName] #positive_value -5%#! или [GetLawType('law_polluting_mining_banned').GetName] #positive_value -10%#!\n• [GetTechnology('urban_sustainability').GetName]: #positive_value -10%#!\n\nСокращения перемножаются. Развитие промышленности и загрязняющие [Concept('concept_production_method','$concept_production_methods$')] увеличивают этот показатель, тогда как более чистые методы, например улавливание углерода, сокращают выбросы непосредственно у источника."
 concept_climate_stage_desc: "The $concept_climate_stage$ показывает степень развития глобального потепления по повышению средней температуры планеты относительно #v Доиндустриальный Age#!. Каждые #v +1 °C#! увеличивают #negative_value +100%#! базовую вероятность [GetHarvestConditionType('drought').GetName], [GetHarvestConditionType('heatwave').GetName], [GetHarvestConditionType('wildfire').GetName] и всех экстремальных климатических бедствий.\n\n#positive_value Исторический диапазон#! (до +0.5 °C): экстремальные климатические бедствия отсутствуют.\n#v Обнаружение#! (above +0.5 °C): потепление, вызванное загрязнением, становится измеримым; новых бедствий пока нет.\n#negative_value Оттепель#! (above +1.0 °C): [GetHarvestConditionType('ztr_extreme_heatwave').GetName] and [GetHarvestConditionType('ztr_megadrought').GetName] могут происходить. Интенсивность экстремальных климатических бедствий увеличивается на #negative_value +1#! [concept_harvest_condition_intensity].\n#negative_value Подъём уровня моря#! (above +1.5 °C): [GetHarvestConditionType('ztr_hurricane').GetName] могут обрушиваться на побережья, подверженные циклонам, а [GetHarvestConditionType('ztr_extreme_wildfire').GetName] могут происходить. Бонус к интенсивности увеличивается до #negative_value +2#!.\n#negative_value Критическое потепление#! (above +2.0 °C): [GetHarvestConditionType('ztr_coastal_flooding').GetName] могут затапливать низменные побережья. Бонус к интенсивности увеличивается до #negative_value +3#!." # UPDATED

 concept_demographic_drift: "Демографическая инерция"
 concept_demographic_factors: "Демографический Factилиs"

 concept_social_momentum: "Социальная динамика"

 concept_demographic_stages_desc: "[Concept('concept_demographic_stages','$concept_demographic_stages$')] описывают демографическое развитие [Concept('concept_country','$concept_country$')], оцениваемое по шкале от #b 0 to 1000#!.\nПервый этап охватывает значения #b 0 to 200#!, затем каждые #b #white 100#! очков#! переводят страну на следующий этап.\n#white Годовой прогресс#! ограничен значениями #positive_value +15#! and #negative_value -5#! очков и зависит от [concept_demographic_drift], [concept_social_momentum] and [concept_demographic_factилиs].\n\n#v 1. Доиндустриальный#!:\n[GetStaticModifier('demographic_stage_1').GetDesc]\n#v 2. Ранняя индустриализация#!:\n[GetStaticModifier('demographic_stage_2').GetDesc]\n#v 3. Средняя индустриализация#!:\n[GetStaticModifier('demographic_stage_3').GetDesc]\n#v 4. Поздняя индустриализация#!:\n[GetStaticModifier('demographic_stage_4').GetDesc]\n#v 5. Ранний постиндустриальный#!:\n[GetStaticModifier('demographic_stage_5').GetDesc]\n#v 6. Средний постиндустриальный#!:\n[GetStaticModifier('demographic_stage_6').GetDesc]\n#v 7. Поздний постиндустриальный#!:\n[GetStaticModifier('demographic_stage_7').GetDesc]\n#v 8. Стадия стагнации#!:\n[GetStaticModifier('demographic_stage_8').GetDesc]\n#v 9. Стадия упадка#!:\n[GetStaticModifier('demographic_stage_9').GetDesc]" # UPDATED

 concept_social_momentum_desc: "$concept_social_momentum$ сравнивает нынешние показатели [concept_sol] and GDP per capita с показателями #b пятилетней давности#!. Рост более чем на #b 4%#! считается улучшением.\n\n#white Этапы с 1-го по 6-й#!:\n• Улучшение #positive_value ускоряет#! переход.\n• Стагнация или спад #negative_value slows it down#!.\n\n#white Начиная с 7-го этапа#!:\n• Улучшение #negative_value замедляет#! переход.\n• Стагнация или спад #positive_value speeds it up#!.\n\nЕго влияние усиливается с ростом [concept_literacy]. Требуется #b five years#! зафиксированных исторических данных." # UPDATED

 concept_demographic_factors_desc: "$concept_demographic_factилиs$ #b ускоряют#! или #b сдерживают#! the [Concept('concept_demographic_stages','$concept_demographic_stages$')] независимо от [concept_literacy] and [concept_sol]:\n• #b Законы о здравоохранении#!: [GetLawType('law_private_health_insurance').GetName] или [GetLawType('law_public_health_insurance').GetName] ускоряют переход на этапах с 1-го по 6-й.\n• #b Законы о рабстве#!: легальное рабство замедляет переход начиная со 2-го этапа.\n• #b Законы об иммиграции#!: [GetLawType('law_multicultural').GetName] или [GetLawType('law_no_migration_controls').GetName] замедляют его начиная с 3-го этапа; на последующих этапах эффект усиливается. Только в странах Америки или государствах с населением менее 200 миллионов человек.\n• #b Культура#!: a Sunni или Shia [concept_state_religion], или [GetLawType('law_hindu_caste_enfилиced').GetName] или [GetLawType('law_hindu_caste_codified').GetName] in [GetLawGroup('lawgroup_caste_hegemony').GetName], замедляют переход на этапах с 1-го по 4-й.\n\nСтраны #b Americas#! and #b Oceania#! проходят демографический переход медленнее." # UPDATED

 concept_demographic_drift_desc: "$concept_demographic_drift$ — это структурное воздействие на [Concept('concept_demographic_stages','$concept_demographic_stages$')]. Оно усиливается под влиянием:\n• [concept_literacy]: — #b главный фактор#!.\n• [concept_sol]: влияние усиливается до значения #b 20#!. Начиная с этапа #b 6#!, более высокий показатель [concept_sol] дополнительно ускоряет процесс; максимальное влияние наблюдается около значения #b 25#!.\n• #b Время#!: оно усиливается каждые 30 лет начиная с #b 1880#!.\n\nЭто воздействие #b ослабевает#! по мере продвижения по этапам: если этап страны опережает уровень грамотности и жизни населения, страна #b откатывается назад#!." # UPDATED

 concept_un_human_rights_desc: "Резолюции ООН о правах человека напрямую изменяют несовместимые [Concept('concept_law','$concept_laws$')] законы стран-участниц после принятия резолюции и при вступлении государства в организацию. Они также запрещают участникам принимать законы, не соответствующие установленному стандарту. Стандарты, требующие определённых технологий или уровня развития, начинают действовать сразу после выполнения соответствующих условий. Эти обязательства распространяются даже на участников, голосовавших против.\n\nНаиболее строгие стандарты в области [concept_un_children_rights], the [concept_un_women_rights] and the [concept_un_labили_rights] не вводятся принудительно: каждые #v 5#! лет отстающим участникам предлагают принять законы [GetLawType('law_compulsилиy_primary_school').GetName], [GetLawType('law_women_in_the_wилиkplace').GetName] или [GetLawType('law_wилиker_protections').GetName]. Отказ добавляет #N 5#! [concept_infamy] и накладывает [Concept('concept_un_condemnation','$concept_un_condemnation$')]; повторное осуждение приводит к исключению.\n\nДоступны шесть резолюций: [Concept('concept_un_decolonization','$concept_un_decolonization$')], [Concept('concept_un_slavery','$concept_un_slavery$')], [concept_un_children_rights], [concept_un_women_rights], [concept_un_environment] and [concept_un_labили_rights]." # UPDATED

 concept_un_subject_unesco_desc: "После создания каждый член ООН получает:\n• #P +50#! $country_tech_spread_add$\n• #N -25%#! $state_assimilation_mult$\n• #N -25%#! $country_prestige_from_army_power_projection_mult$\n• #N -25%#! $country_prestige_from_navy_power_projection_mult$\n\nЮНЕСКО способствует распространению знаний между странами, а её участники обязуются защищать культурное разнообразие и развивать культуру мира. Эффекты действуют, пока страна остаётся членом ООН.\n\nКаждые #v 5#! years, ЮНЕСКО также предлагает участникам, в которых действуют законы [GetLawType('law_no_schools').GetName] или [GetLawType('law_terakoya').GetName] создать систему школьного образования, предпочтительно посредством закона [GetLawType('law_public_schools').GetName]. Отказ добавляет #N 5#! [concept_infamy] и накладывает [Concept('concept_un_condemnation','$concept_un_condemnation$')]." # UPDATED

 concept_un_condemnation: "Осуждение ООН"

 concept_un_condemnation_desc: "Член [Concept('concept_united_nations','$concept_united_nations$')] подвергается осуждению, если отказывается выполнить требование ООН о реформе, противодействует вмешательству ООН или сохраняет колониальные либо рабовладельческие практики, запрещённые резолюциями организации. Осуждения накапливаются:\n• #b Первое осуждение#!: $ztr_un_condemned_modifier$ (#N -10%#! [concept_prestige], #N -15%#! [concept_influence], #N -10#! [concept_legitimacy]) и #N приостановление членства#!: страна не может голосовать и предлагать реформы.\n• #b Второе осуждение#!: штрафы #N удваиваются#!, а страну #N исключают#! из ООН.\n\nСчётчик сбрасывается через #v 10 years#! после первого осуждения: штрафы прекращают действовать, а исключённая страна может подать заявку на повторное вступление. В случаях агрессии, колониального правления или рабства [Concept('concept_un_subject_icc','$concept_un_subject_icc$')], после создания начинает собственное расследование в дополнение к осуждению." # UPDATED

 concept_un_member_selection_desc: "The $concept_un_member_selection$ rule of the [Concept('concept_united_nations','$concept_united_nations$')] определяет порядок распределения постоянных мест в Совете Безопасности. Постоянные члены могут предлагать реформы и, если [Concept('concept_un_veto_right','$concept_un_veto_right$')] действует право вето, блокировать предложения.\n\n#b $ztr_un_law_member_selection_1$#!\n$ztr_un_law_member_selection_1_desc$\n\n#b $ztr_un_law_member_selection_2$#!\n$ztr_un_law_member_selection_2_desc$\n\n#b $ztr_un_law_member_selection_3$#!\n$ztr_un_law_member_selection_3_desc$\n\n#b $ztr_un_law_member_selection_4$#!\n$ztr_un_law_member_selection_4_desc$\n\n#b Выдвижение кандидатур#!\nПри правилах $ztr_un_law_member_selection_1$, $ztr_un_law_member_selection_3$ and $ztr_un_law_member_selection_4$, сильный обычный член может претендовать на постоянное место раз в #v 30#! лет: кандидат должен входить в число #v 4#! сильнейших стран или в число #v 2#! сильнейших при правиле $ztr_un_law_member_selection_4$. Если голосование завершается успехом, кандидат занимает свободное место или заменяет самого слабого постоянного члена, который не может применить право вето при этом голосовании.\n\n#b Выборные места#!\nКаждые #v 9#! years, #v 4#! Обычные члены рангом не ниже малой державы случайным образом выбираются на выборные места; участники предыдущего срока не могут быть выбраны повторно. Выборные члены могут предлагать резолюции о правах человека при совместном подписании постоянным членом и голосуют в случаях, когда голосует только Совет Безопасности. Выборы проводятся заново при каждом изменении состава постоянных членов." # UPDATED

 concept_un_subject_icc_desc: "После создания каждый член ООН получает:\n• #P +5#! $country_legitimacy_base_add$\n• #N +15%#! $country_infamy_генерация_mult$\n\nВо время #v yearly review#!, члены ООН, имеющие #v 60 или mилиe#! [concept_infamy] попадают под расследование сроком на #v 5 years#!:\n• #N -25%#! $country_prestige_mult$\n• #N -50%#! $country_influence_mult$\n• #N -10%#! $country_infamy_decay_mult$\n\nСохранение показателя на пороговом уровне или выше продлевает расследование при последующих проверках." # UPDATED

 concept_un_subject_iaea: "МАГАТЭ"
 concept_un_subject_iaea_desc: "Международное агентство по атомной энергии контролирует мирное использование ядерной энергии и сокращение ядерных арсеналов. Предложение о его создании можно внести после первого применения атомной бомбы.\n\nПосле создания страны могут подписать договоры о ядерной деэскалации: #v $nuclear_de_escalation_treaty$#! and #v $pause_nuclear_weapons_development$#!."

 concept_un_membership_desc: "#b Преимущества и издержки для всех участников#!
• #P +100#! еженедельной [concept_innovation]
• #P +25#! [concept_legitimacy] с учётом доли голосов партий в правительстве
• #v -80%#! квоты на [concept_migration]
• #v -25%#! [concept_prestige] за военную [concept_power_projection]

#b Обычные члены#!
#N -25%#! [concept_influence], #N +50%#! к генерации [concept_infamy] и #P -5 процентных пунктов#! к процентной ставке по [concept_loans].

#b Постоянные члены#!
#N -30%#! [concept_influence] и #N +35%#! к генерации [concept_infamy]. Они могут предлагать резолюции и накладывать на них вето, если это право действует.

#b Вступление#!
Вступление признаёт ранее непризнанные страны и сразу приводит их законодательство в соответствие со стандартами ООН:
• [GetLawType('law_no_health_system').GetName] заменяется на [GetLawType('law_charitable_health_system').GetName]
• [GetLawType('law_outlawed_dissent').GetName] заменяется на [GetLawType('law_censorship').GetName]
• [GetLawType('law_ethnostate').GetName] или [GetLawType('law_national_supremacy').GetName] заменяется на [GetLawType('law_racial_segregation').GetName]
Также вступают в силу действующие [Concept('concept_un_human_rights','$concept_un_human_rights$')].

Созданные [Concept('concept_un_subject_wto','$concept_un_subject_wto$')], [Concept('concept_un_subject_icc','$concept_un_subject_icc$')] и [Concept('concept_un_subject_unesco','$concept_un_subject_unesco$')] дают дополнительные бонусы. Программа [Concept('concept_un_subject_imf','$concept_un_subject_imf$')] направлена на поддержку стран с низким уровнем жизни, а не предоставляет одинаковый бонус всем участникам.

Обычные члены могут выйти из организации посредством решения после изучения [GetTechnology('international_organizations').GetName], не ранее 1946 года и вне периода текущего голосования. Выход добавляет #N 25#! [concept_infamy] и снимает модификаторы членства в ООН, ВТО, МУС и ЮНЕСКО.

#b Взносы в ООН#!
Каждый год участник обязан перечислять сумму, равную #v 0,25%#! его ВВП; после создания [Concept('concept_un_subject_imf','$concept_un_subject_imf$')] эта сумма удваивается, а для постоянных членов удваивается ещё раз. Размер взноса зависит от уровня развития: на низшем уровне он равен нулю, на высшем выплачивается полностью. Взнос выплачивается еженедельно и учитывается в бюджете в разделе дополнительных расходов. Осуждённый участник не платит взнос, но лишается права голоса; отказ от выплаты сам по себе является основанием для [Concept('concept_un_condemnation','$concept_un_condemnation$')]." # UPDATED
 concept_un_voting_desc: "Постоянные члены Совета Безопасности могут предлагать изменения через #v Организация Объединённых Наций#! [concept_journal_entry]. После #v 30 days#! обсуждения участники, имеющие право голоса, получают событие, а #v UN Vote Session#! [concept_journal_entry] открывается на #v six months#!.\n\nГолосовать можно через событие или кнопки #v Vote In Favили#! and #v Vote Against#! в записи журнала [concept_journal_entry]. Менять голос можно до закрытия сессии. Если отложить решение, голос будет засчитан как нейтральный; нейтральные голоса не добавляют ни сторонников, ни противников.\n\nПраво голоса и его вес зависят от действующей [Concept('concept_un_voting_model','$concept_un_voting_model$')]. Предложение принимается, только если #P suppилиt exceeds opposition#! по итогам сессии; при равенстве голосов оно отклоняется. Если [Concept('concept_un_veto_right','$concept_un_veto_right$')] are enabled, #N постоянный член может заблокировать предложение, наложив вето#!; повторно наложить вето, заблокировавшее большинство, можно лишь через #v 10 years#!.\n\nПринятые решения распространяются на всех членов ООН, включая голосовавших против. После закрытия сессии страны под управлением ИИ не будут выдвигать новые предложения в течение #v 4 years#!." # UPDATED
 concept_research_philosophy_desc: "The [Concept('concept_research_philosophy','$concept_research_philosophy$')] определяет, как Национальный исследовательский центр использует каждое очко [Concept('concept_research_capacity','$concept_research_capacity$')]:\n\n#v Независимые исследования#!: #P +4#! максимум [Concept('concept_innovation','$concept_innovation$')] and #N -0.5%#! [Concept('concept_technology_spread','$concept_technology_spread$')]. Крупная научная система самостоятельно определяет направления исследований, но медленнее осваивает зарубежные открытия. Лучше всего подходит странам, где более #v 40 million#! [Concept('concept_literate_citizens','$concept_literate_citizens$')].\n\n#v Освоение технологий#!: #P +3%#! [Concept('concept_technology_spread','$concept_technology_spread$')]. Небольшая научная система быстрее перенимает зарубежный опыт.\n\nПосле этого стратегию можно менять раз в #v 10#! years." # UPDATED

