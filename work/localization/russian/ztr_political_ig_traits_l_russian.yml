l_russian:
 ig_trait_ztrpol_social_partnership: "Социальное партнёрство"
 ig_trait_ztrpol_social_partnership_desc: "Профсоюзы и работодатели садятся за один стол: заработная плата определяется переговорами, а не борьбой, и заводы продолжают работать."
 ig_trait_ztrpol_universal_welfare: "Всеобщее благосостояние"
 ig_trait_ztrpol_universal_welfare_desc: "Медицинская помощь, пенсии и жильё для всех, оплачиваемые всеми. Государство всеобщего благосостояния — главное достижение этого движения."
 ig_trait_ztrpol_shock_brigades: "Ударные бригады"
 ig_trait_ztrpol_shock_brigades_desc: "Добровольческие рабочие бригады стремятся перевыполнить план, возводя плотины, заводы и жилые кварталы в рекордные сроки."
 ig_trait_ztrpol_lay_schooling: "Светское образование"
 ig_trait_ztrpol_lay_schooling_desc: "Бесплатное светское образование для каждого ребёнка — вернейший путь к просвещённому и современному обществу."
 ig_trait_ztrpol_cooperative_credit: "Кооперативное кредитование"
 ig_trait_ztrpol_cooperative_credit_desc: "Фермеры объединяют сбережения, технику и урожай, получая займы в собственных кооперативных банках, а не в городах."
 ig_trait_ztrpol_farmer_blockades: "Фермерские блокады"
 ig_trait_ztrpol_farmer_blockades_desc: "Тракторы перекрывают автомагистрали, а у министерств растут кучи навоза. Власти больше не смогут игнорировать сельскую местность."
 ig_trait_ztrpol_state_procurement: "Государственные закупки"
 ig_trait_ztrpol_state_procurement_desc: "Коллективные хозяйства поставляют государству продукцию по установленным квотам и фиксированным ценам, обеспечивая продовольствием и города, и казну."
 ig_trait_ztrpol_charitable_works: "Благотворительная деятельность"
 ig_trait_ztrpol_charitable_works_desc: "Больницы, бесплатные столовые и приюты, действующие при поддержке верующих, смягчают тяготы современной жизни."
 ig_trait_ztrpol_confessional_democracy: "Конфессиональная демократия"
 ig_trait_ztrpol_confessional_democracy_desc: "Вера и избирательная урна не противоречат друг другу. Религиозные партии преодолевают расколы, которые иначе могли бы разорвать нацию."
 ig_trait_ztrpol_national_crusade: "Национальный крестовый поход"
 ig_trait_ztrpol_national_crusade_desc: "Алтарь и знамя стоят бок о бок. Защищать нацию — значит защищать веру, и верующие откликаются на этот призыв."
 ig_trait_ztrpol_managerial_revolution: "Управленческая революция"
 ig_trait_ztrpol_managerial_revolution_desc: "Профессиональные управляющие, бизнес-школы и современный бухгалтерский учёт сделали наши корпорации более эффективными и производительными."
 ig_trait_ztrpol_national_champions: "Национальные чемпионы"
 ig_trait_ztrpol_national_champions_desc: "Несколько крупных национальных компаний, защищаемых и поддерживаемых государством, обеспечивают промышленную мощь страны и наполняют её казну."
 ig_trait_ztrpol_anti_elite_fervor: "Антиэлитный пыл"
 ig_trait_ztrpol_anti_elite_fervor_desc: "Истеблишмент предал простой народ! Каждый скандал и каждое невыполненное обещание усиливают гнев мелких торговцев."
 ig_trait_ztrpol_lean_government: "Компактное правительство"
 ig_trait_ztrpol_lean_government_desc: "Каждая копейка налогоплательщиков должна быть учтена. Меньше учреждений, меньше бумаг, меньше чиновников."
 ig_trait_ztrpol_party_cadres: "Партийные кадры"
 ig_trait_ztrpol_party_cadres_desc: "Верные партии кадры, обученные административной работе, занимают все должности — от сельского совета до министерства."
 ig_trait_ztrpol_mass_mobilization: "Массовая мобилизация"
 ig_trait_ztrpol_mass_mobilization_desc: "Митинги, молодёжные организации и партийные ополчения привязывают массы к режиму и пополняют ряды армии."
 ig_trait_ztrpol_political_commissars: "Политические комиссары"
 ig_trait_ztrpol_political_commissars_desc: "Рядом с каждым командиром стоит партийный комиссар, следящий за тем, чтобы войска не утратили верность и решимость."
 ig_trait_ztrpol_barracks_plotting: "Заговоры в казармах"
 ig_trait_ztrpol_barracks_plotting_desc: "Недовольные офицеры встречаются за закрытыми дверями. Каждая неудача правительства становится ещё одним доводом в пользу военного переворота."

