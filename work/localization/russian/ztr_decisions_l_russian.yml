decolonization_new_zealand_decision_desc: "Колониальная эпоха уходит в прошлое. Мы должны положить конец колониальному правлению в Новой Зеландии и предоставить местному населению возможность самостоятельно управлять своей страной. Это улучшит наши отношения с новозеландским населением и укрепит международную репутацию государства, уважающего право народов на самоопределение."

decolonization_new_zealand_decision_gbr: "Создать колонию Новая Зеландия"
decolonization_new_zealand_decision_gbr_desc: "Наша австралийская колония за последние годы значительно выросла, и настало время учредить отдельную колонию в Новой Зеландии. Это позволит эффективнее управлять регионом и лучше учитывать интересы его жителей, большинство которых составляют маори."

decolonization_indonesia_netherlands_consolidation: "Объединить Нидерландскую Ост-Индию"
decolonization_indonesia_netherlands_consolidation_desc: "Нидерландская Ост-Индия уже давно является ценной колонией нашей страны. Нам следует включить в неё остальные нидерландские территории региона, создав единую административную структуру. Такая консолидация упростит управление, улучшит использование ресурсов и позволит эффективнее реагировать на местные потребности и проблемы."

ztr_trait_hiddening_decision: "Скрыть региональные особенности Tech & Res"
ztr_trait_hiddening_decision_desc: "Региональные особенности Tech & Res будут скрыты. (Функция находится в разработке; используйте её, только если действительно не хотите видеть эти особенности.)"

ztr_trait_unhiddening_decision: "Показать региональные особенности Tech & Res"
ztr_trait_unhiddening_decision_desc: "Действие говорит само за себя."

ztr_hindu_decision: "Утвердить индуизм в качестве государственной религии"
ztr_hindu_decision_desc: "Чтобы укрепить национальную идентичность и культурное наследие, нам необходимо отказаться от влияния чужих религий, например ислама, и утвердить индуизм в качестве [Concept('concept_state_religion','государственной религии')]. Это решение поможет объединить население общей верой, но может вызвать напряжённость в отношениях с религиозными меньшинствами."

ztr_anschluss_decision: "Добиться аншлюса с Австрией"
ztr_anschluss_decision_desc: "Объединение Германии и Австрии давно было мечтой многих наших соотечественников. Аншлюс укрепит нашу страну как в политическом, так и в экономическом отношении. Немецкий народ должен быть объединён под одним флагом."

ztr_us_wants_to_buy_west_coast: "Начать переговоры о покупке западного побережья"
ztr_us_wants_to_buy_west_coast_desc: "С окончания эпохи освоения Дикого Запада прошло много лет, и наши западные территории стали значительно более развитыми и процветающими. Однако порты на побережье Тихого океана и плодородные земли Калифорнии значительно расширили бы наши торговые возможности и стратегическую глубину. Следует рассмотреть возможность переговоров с Мексикой о покупке этих территорий под предлогом цивилизаторской миссии, несущей прогресс и процветание."

ztr_give_newfoundland_to_canada: "Передать Ньюфаундленд Канаде"
ztr_give_newfoundland_to_canada_desc: "Ньюфаундленд всегда был отдалённой и в некоторой степени изолированной колонией, тесно связанной с Канадой культурно и экономически. Передача Ньюфаундленда Канаде позволит его жителям воспользоваться преимуществами более тесной интеграции с канадской экономикой и обществом. Это также даст нам возможность сосредоточить ресурсы на более важных направлениях."

# NEW 1.6

start_national_electric_system_conversion_decision: "Начать переход на национальную электросеть"
start_national_electric_system_conversion_decision_desc: "Местные электросети больше не способны справляться с масштабами и нестабильностью современной выработки электроэнергии. Начало перехода обяжет страну построить подстанции электросети во всех включённых в состав государства штатах, прежде чем будет активирована национальная система электроснабжения."
start_national_electric_system_conversion_decision_tooltip: "Запускает запись в журнале #v «Национальная система электроснабжения»#!."
modernize_national_electric_system_decision: "Модернизировать национальную систему электроснабжения"
modernize_national_electric_system_decision_desc: "Национальная электросеть уже объединяет региональные энергосистемы. Её модернизация позволит внедрить передовые методы управления передачей электроэнергии и подготовит страну к более масштабной и гибкой выработке энергии."
modernize_national_electric_system_decision_tooltip: "Активирует #v «Современная национальная система электроснабжения»#!."



decolonization_bahamas_decision: "Освободить: Багамские острова"
decolonization_bahamas_decision_desc: "Прекратить наше прямое управление Багамских островах и предоставить местному населению возможность самостоятельно управлять своей страной. Признание права багамским народа на самоопределение укрепит нашу международную репутацию."


