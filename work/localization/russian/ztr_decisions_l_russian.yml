l_russian:

good_friday_agreement_decision: "Заключить Белфастское соглашение (Соглашение Страстной пятницы)"
good_friday_agreement_decision_desc: "Белфастское соглашение стало важнейшим политическим событием в Северной Ирландии: оно учредило автономное правительство и заложило основу для мира и сотрудничества. Его выполнение позволит обеспечить стабильность и дальнейшее развитие региона."
good_friday_agreement_decision_tooltip: "Ольстер возвращён!"

firm_ztr_geneva_convention: "Подписать Женевские конвенции"
firm_ztr_geneva_convention_desc: "Женевские конвенции — ряд международных договоров, устанавливающих правовые нормы гуманного обращения во время войны. Подписав их, мы обязуемся соблюдать права человека и защищать мирное население во время вооружённых конфликтов."
firm_ztr_geneva_convention_tooltip: "Женевские конвенции подписаны."

withdraw_ztr_geneva_convention: "Выйти из Женевских конвенций"
withdraw_ztr_geneva_convention_desc: "Выход из Женевских конвенций будет означать отказ от наших обязательств по международному гуманитарному праву. Это может привести к росту страданий и нарушениям прав человека во время вооружённых конфликтов."
withdraw_ztr_geneva_convention_tooltip: "Выход из Женевских конвенций оформлен."

enter_ztr_society_of_nations: "Вступить в Лигу Наций"
enter_ztr_society_of_nations_desc: "Вступление в Лигу Наций позволит нам участвовать в международной дипломатии и сотрудничестве, содействуя миру и стабильности. Это возможность укрепить наше положение в мире и наладить взаимодействие с другими государствами."
enter_ztr_society_of_nations_tooltip: "Членство в Лиге Наций получено."

withdraw_ztr_society_of_nations: "Выйти из Лиги Наций"
withdraw_ztr_society_of_nations_desc: "Выход из Лиги Наций изолирует нас от международной дипломатии и сотрудничества. Это может усилить напряжённость и затруднить эффективное решение глобальных проблем."
withdraw_ztr_society_of_nations_tooltip: "Членство в Лиге Наций прекращено."

un_foundation: "Учредить Организацию Объединённых Наций"
un_foundation_desc: "Организация Объединённых Наций — международная организация, созданная для поддержания мира и безопасности и развития сотрудничества между государствами. Учредив ООН, мы сможем сыграть важную роль в формировании системы глобального управления и решении международных проблем."
un_foundation_tooltip: "Организация Объединённых Наций учреждена."

become_member_united_nations: "Вступить в Организацию Объединённых Наций"
become_member_united_nations_desc: "Вступление в ООН укрепит наше международное положение и позволит участвовать в принятии глобальных решений. Это шаг к более тесному сотрудничеству с другими государствами."
become_member_united_nations_tooltip: "Членство в ООН получено."

withdraw_united_nations: "Выйти из Организации Объединённых Наций"
withdraw_united_nations_desc: "Выход из ООН изолирует нас от глобального управления и международного сотрудничества. Это может усилить напряжённость и затруднить решение международных проблем."
withdraw_united_nations_tooltip: "Членство в ООН прекращено."

decolonization_tunisia_decision: "Освободить: Тунис"
decolonization_tunisia_decision_desc: "Колониальная эпоха уходит в прошлое. Мы должны положить конец колониальному правлению в Тунисе и предоставить местному населению возможность самостоятельно управлять своей страной. Это улучшит наши отношения с тунисским населением и укрепит международную репутацию государства, уважающего право народов на самоопределение."

