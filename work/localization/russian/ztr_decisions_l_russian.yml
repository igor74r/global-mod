# NEW 1.3

indian_unifier_decision: "Выдвинуть кандидатуру на объединение Индии"
indian_unifier_decision_desc: "После британской колонизации Индия оказалась раздроблена на множество государств. Сильная держава, подобная нашей, могла бы объединить их под единым знаменем и создать могущественную индийскую нацию, способную противостоять иностранным державам и их имперским амбициям."

decolonization_india_decision: "Включить индийские государства в состав Индии"
decolonization_india_decision_desc: "Индийская держава среднего ранга объявила своего правителя объединителем Индии, стремясь воспользоваться эпохой после британской колонизации для установления индийской гегемонии. Интегрировать ли наши земли в Индию или продолжить управлять ими по отдельности? Решение за нами."

decolonization_korea_decision: "Освободить: Корею"
decolonization_korea_decision_desc: "Колониальная эпоха уходит в прошлое. Мы должны положить конец колониальному правлению в Корее и предоставить местному населению возможность самостоятельно управлять своей страной. Это улучшит наши отношения с корейским населением и укрепит международную репутацию государства, уважающего право народов на самоопределение."

