ztr_population_measure_decision: "Ввести меры по охране здоровья населения"
ztr_population_measure_decision_desc: "На фоне сокращения населения и отсутствия развитой национальной системы здравоохранения, несмотря на развитую экономику и технологии, мы должны принять меры для улучшения здоровья и благополучия граждан. Это решение позволит ввести соответствующий закон после обсуждения с наиболее влиятельными группами интересов и тем самым оздоровить население."

