durrand_line: "Подписать Гандамакский договор"
durrand_line_desc: "Закрепить границы между Афганистаном, Персией и Индией."
decolonization_india_raj_consolidation: "Объединить Британскую Индию"
decolonization_india_raj_consolidation_desc: "Британская Индия будет консолидирована."
decolonization_india_raj_takes_uk_states: "Передать британские территории Британской Индии"
decolonization_india_raj_takes_uk_states_desc: "Британская Индия получит британские территории на Индийском субконтиненте."
decolonization_india_raj_independence_request: "Потребовать независимости от Британской империи"
decolonization_india_raj_independence_request_desc: "Прошло более столетия с тех пор, как британцы установили централизованное правление над всем Индийским субконтинентом. Настало время потребовать независимости от Британской империи и создать суверенное индийское государство — или нечто близкое к нему, учитывая наши культурные и религиозные различия. Если нам откажут, придётся добиваться свободы силой."

ztr_austrian_german_partition_treaty: "Австро-прусский договор о разделе Германии"
ztr_austrian_german_partition_treaty_desc: "После десятилетий соперничества и несбывшихся амбиций ни Вене, ни Берлину так и не удалось создать единую германскую нацию. Вместо объединения националистические настроения лишь углубили раскол между двумя великими державами, приведя к бесплодным и разрушительным войнам.
В начале XX века, чтобы положить конец постоянным распрям и обеспечить безопасность наших германских земель, мы можем встретиться с соперниками в Мюнхене и заключить торжественный договор: официально разделить германские государства на австрийскую и прусскую сферы влияния, сменив мечту об объединении тщательно выверенным, но хрупким миром."

ztr_super_germany_sphere_of_influence: "Вопрос негерманских территорий"
ztr_super_germany_sphere_of_influence_desc: "С момента образования Германской империи, ныне ставшей мировой державой, население южных и восточных областей требует большей автономии, чтобы сохранить свою самобытность в обмен на лояльность и дальнейшую централизацию власти над германским жизненным пространством. Это может стать основой эффективной сферы влияния и позволит избежать культурных трений между местным населением и центральной властью."

