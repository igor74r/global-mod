 # Показатели рождаемости и смертности добавляются в TOOLTIP_COUNTRY_POP_GROWTH. Вычисления GetPlayer оставлены без изменений.
 ztr_demography_vital_rates: "$ztr_demography_vital_births_label$#v [Multiply_CFixedPoint(Max_CFixedPoint(Max_CFixedPoint(Add_CFixedPoint(GetPlayer.MakeScope.ScriptValue('ztr_demography_birth_base'), Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('ztr_demography_birth_share'), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000'))), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000')), '(CFixedPoint)0'), GetPlayer.MakeScope.ScriptValue('ztr_demography_population_thousands'))|*]#!$ztr_demography_vital_deaths_label$#v [Multiply_CFixedPoint(Subtract_CFixedPoint(Max_CFixedPoint(Max_CFixedPoint(Add_CFixedPoint(GetPlayer.MakeScope.ScriptValue('ztr_demography_birth_base'), Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('ztr_demography_birth_share'), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000'))), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000')), '(CFixedPoint)0'), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000')), GetPlayer.MakeScope.ScriptValue('ztr_demography_population_thousands'))|*]#!$ztr_demography_vital_children_label$#v [Multiply_CFixedPoint(Max_CFixedPoint(Max_CFixedPoint(Add_CFixedPoint(GetPlayer.MakeScope.ScriptValue('ztr_demography_birth_base'), Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('ztr_demography_birth_share'), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000'))), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000')), '(CFixedPoint)0'), GetPlayer.MakeScope.ScriptValue('ztr_demography_fertility_factor'))|2]#!"

 je_demography_reason: "[ROOT.GetCountry.GetName] находится на стадии #v [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_applied_stage')|0]#! из 9 стадий [Concept('concept_demographic_stages','$concept_demographic_stages$')]: [SCOPE.GetRootScope.GetCountry.GetCustom('ztr_demography_stage_flavour')].\n\n[ROOT.GetCountry.GetPopGrowthDesc]\n\nСтадия 1 охватывает значения #b от 0 до 200#!. Затем каждые #b #white 100#! пунктов#! страна переходит на следующую стадию.\n#white Годовой прогресс#! ограничен значениями от #positive_value +15#! до #negative_value -5#! пунктов.\n\nНа прогресс влияют следующие факторы:\n[concept_demographic_drift]: [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_shown_drift')|+=1]\n[concept_social_momentum]: [ROOT.GetCountry.GetCustom('ztr_demography_social_momentum')]\n[concept_demographic_factors]: [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_shown_extra')|+=1]\n$TAB$• [GetLawGroup('lawgroup_health_system').GetName]: [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_shown_healthcare')|+=1]\n$TAB$• [GetLawGroup('lawgroup_slavery').GetName]: [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_shown_slavery')|+=1]\n$TAB$• [GetLawGroup('lawgroup_citizenship').GetName] / [GetLawGroup('lawgroup_migration').GetName]: [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_shown_immigration')|+=1]\n$TAB$• [GetLawType('law_coercive_pronatalism').GetName]: [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_shown_pronatalism')|+=1]\n$TAB$• Культура: [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_shown_traditional')|+=1][ROOT.GetCountry.GetCustom('ztr_demography_region_factor')]" # UPDATED
