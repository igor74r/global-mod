# National electricity system laws
lawgroup_national_electric_system: "Система электроснабжения"
lawgroup_national_electric_system_desc: "Законы, определяющие, организовано ли электроснабжение на основе местных сетей или единой национальной системы передачи электроэнергии."
law_no_national_electric_system: "Местные системы электроснабжения"
law_no_national_electric_system_desc: "Электроснабжение организовано на основе местных и региональных сетей. Такая система упрощает распределение энергии, но не позволяет стране опираться на крупные электростанции с переменной выработкой, которым необходимы балансировка на национальном уровне и передача энергии на большие расстояния."
law_national_electric_system: "Национальная система электроснабжения"
law_national_electric_system_desc: "Национальная система передачи электроэнергии объединяет местные сети в единую координируемую структуру. Она позволяет подключать крупные электростанции и источники с переменной выработкой, включая возобновляемую энергетику, не перегружая изолированные местные сети."
law_modern_national_electric_system: "Современная национальная система электроснабжения"
law_modern_national_electric_system_desc: "Национальная энергосеть управляется как современная высокопроизводительная система электроснабжения. Передовые методы передачи и управления позволяют поддерживать очень крупные и гибкие мощности по производству электроэнергии."

