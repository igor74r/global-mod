l_russian:

# NEW 1.3

# Mining laws
lawgroup_mining_policy: "Политика в области добычи полезных ископаемых"
lawgroup_mining_policy_desc: "Законы, регулирующие горнодобывающую промышленность, включая добычу опасных и стратегически важных ресурсов."

law_mining_unrestricted: "Неограниченная добыча"
law_mining_unrestricted_desc: "Этот закон разрешает строительство шахт всех типов. Он способствует экономическому росту, но может создавать экологические риски и угрозы безопасности."
law_mining_restrict_hazardous: "Ограничение опасной добычи"
law_mining_restrict_hazardous_desc: "Этот закон ограничивает строительство опасных шахт, стремясь сократить ущерб окружающей среде и защитить здоровье населения."
law_mining_strategic: "Стратегическая добыча"
law_mining_strategic_desc: "Этот закон разрешает строительство только стратегически важных шахт, например рудников редкоземельных элементов. Его цель — обеспечить экономику и вооружённые силы страны необходимыми ресурсами."
law_polluting_mining_banned: "Запрет загрязняющей добычи"
law_polluting_mining_banned_desc: "Этот закон ограничивает строительство всех шахт и закрывает загрязняющие предприятия, чтобы защитить окружающую среду и здоровье населения. Это важный шаг к устойчивому развитию, но одновременно тормоз для экономики."

# Uranium laws
lawgroup_uranium_usage: "Использование урана"
lawgroup_uranium_usage_desc: "Законы, регулирующие использование урана, в том числе в ядерных реакторах и оружии."

law_uranium_civil_usage: "Гражданское использование урана"
law_uranium_civil_usage_desc: "Этот закон разрешает использовать уран в гражданских целях, например для выработки ядерной энергии. Он способствует энергетической независимости и снижает зависимость от ископаемого топлива."
law_uranium_full_usage: "Военное использование урана" # The only way to have an #i Atomic Bomb#!
law_uranium_full_usage_desc: "Этот закон разрешает использовать уран как в гражданских, так и в военных целях, включая создание ядерного оружия. Он способствует энергетической независимости и укрепляет национальную безопасность. При наличии этого закона у вас есть #i атомная бомба#!."
law_uranium_ban: "Запрет на использование урана"
law_uranium_ban_desc: "Этот закон запрещает любое использование урана, как в гражданских, так и в военных целях."

# Bioethics laws
lawgroup_bioethics: "Биоэтика"
lawgroup_bioethics_desc: "Законы, регулирующие биоэтические вопросы, включая право на жизнь, аборты и эвтаназию."
law_life_rights: "Право на жизнь"
law_life_rights_desc: "Этот закон признаёт право на жизнь и запрещает практики, нарушающие это право, такие как эвтаназия и аборты. Он направлен на защиту неприкосновенности жизни и утверждение этических норм в обществе."
law_regulated_adoption: "Регулируемое усыновление"
law_regulated_adoption_desc: "Этот закон регулирует процедуру усыновления, обеспечивая её этичность и соответствие интересам ребёнка. Он направлен на защиту прав детей и поддержку ответственного родительства."
law_abortion: "Право на аборт"
law_abortion_desc: "Этот закон регулирует аборты и разрешает их при определённых условиях. Он призван уравновесить права матери и нерождённого ребёнка, способствуя ответственному подходу к репродуктивному здоровью."
law_euthanasia: "Право на эвтаназию"
law_euthanasia_desc: "Этот закон разрешает эвтаназию при определённых условиях, признавая право человека на достойную смерть. Он предоставляет гуманные варианты людям с неизлечимыми заболеваниями или невыносимыми страданиями при соблюдении строгих этических норм."

# Data laws
lawgroup_data_policy: "Политика в области данных"
lawgroup_data_policy_desc: "Законы, регулирующие сбор данных и конфиденциальность, включая использование биометрических данных и защиту персональной информации."
law_data_free_harvest: "Свободный сбор данных"
law_data_free_harvest_desc: "Этот закон разрешает неограниченный сбор данных, включая биометрическую информацию. Он способствует технологическому развитию и принятию решений на основе данных, но вызывает опасения по поводу неприкосновенности частной жизни и личных прав."
law_data_privacy_basic: "Базовая защита данных"
law_data_privacy_basic_desc: "Этот закон устанавливает основные права на конфиденциальность данных, защищая людей от несанкционированного сбора и использования информации. Он призван уравновесить технологический прогресс с необходимостью защиты частной жизни и безопасности."
law_data_biometric_ban: "Запрет биометрических данных"
law_data_biometric_ban_desc: "Этот закон запрещает сбор и использование биометрических данных, таких как отпечатки пальцев и распознавание лиц. Он направлен на защиту частной жизни и предотвращение возможного злоупотребления конфиденциальной информацией."

# LGBTQ+ laws
lawgroup_lgbtq_rights: "Права ЛГБТК+"
lawgroup_lgbtq_rights_desc: "Законы, регулирующие права ЛГБТК+, включая брак, усыновление и защиту от дискриминации."

lgbtq_traditional_couples: "Традиционные роли"
lgbtq_traditional_couples_desc: "Этот закон поддерживает традиционную модель семьи и представление о том, что брак должен заключаться между мужчиной и женщиной. Он не признаёт однополые пары юридически и не предоставляет им правовой защиты, сохраняя традиционные семейные ценности и ограничивая права ЛГБТК+."
lgbtq_sex_equality: "Равенство полов" # This is also a neo-feminism law.
lgbtq_sex_equality_desc: "Этот закон гарантирует равное обращение со всеми людьми независимо от пола и равные возможности перед законом. Он запрещает дискриминацию по признаку пола и сексуальной ориентации и способствует инклюзивности, сохраняя при этом традиционное понимание брака."
lgbtq_civil_unions: "Однополые гражданские союзы"
lgbtq_civil_unions_desc: "Гражданские союзы обеспечивают юридическое признание однополых пар и предоставляют им некоторые права и гарантии, сопоставимые с браком. Хотя они не дают всех преимуществ традиционного брака, это шаг к равенству и интеграции ЛГБТК+, сочетающий прогрессивные ценности с общественными традициями."
lgbtq_full_gender_equality: "Полное гендерное равенство"
lgbtq_full_gender_equality_desc: "Этот закон обеспечивает полное юридическое признание и равные права всех людей независимо от гендера или сексуальной ориентации. Он поддерживает инклюзивность, защищает от дискриминации и гарантирует права ЛГБТК+ во всех сферах жизни, включая брак, усыновление и трудоустройство."

# Environmental laws
lawgroup_environmental_policy: "Экологическая политика"
lawgroup_environmental_policy_desc: "Законы, регулирующие охрану окружающей среды, включая контроль загрязнения и управление природными ресурсами."
law_no_protection: "Отсутствие экологической защиты"
law_no_protection_desc: "В стране нет законов об охране окружающей среды, что обеспечивает максимальный экономический рост ценой деградации природы. Закон разрешает неограниченную промышленную деятельность, ведущую к сильному загрязнению и истощению ресурсов."
law_basic_protection: "Базовая защита окружающей среды"
law_basic_protection_desc: "Этот закон вводит основные меры по охране окружающей среды, включая контроль загрязнения и управление ресурсами. Он призван сочетать экономический рост с экологической устойчивостью, поощряя ответственную промышленную деятельность и защищая природные богатства."
law_active_restoration: "Активное восстановление природы"
law_active_restoration_desc: "Этот закон поддерживает активное восстановление повреждённых экосистем и природных ресурсов. Он поощряет лесовосстановление, охрану среды обитания и очистку от загрязнений, стремясь восстановить экологический баланс и защитить биоразнообразие при сохранении устойчивого экономического развития."

# Compulsory Secondary School
lawgroup_advanced_education: "Политика в области среднего и высшего образования"
law_no_compulsory_secondary_school: "Отсутствие обязательного среднего образования"
law_no_compulsory_secondary_school_desc: "Этот закон отменяет обязательное посещение средней школы: подростки не обязаны получать среднее образование. Это может привести к снижению грамотности и ограничению образовательных возможностей, особенно для социально уязвимых групп."
law_compulsory_secondary_school: "Обязательное среднее образование"
law_compulsory_secondary_school_desc: "Этот закон обязывает всех подростков посещать среднюю школу, обеспечивая базовый уровень образования для каждого гражданина. Он направлен на повышение грамотности и создание основы для дальнейшего обучения, социальной мобильности и экономического развития."
law_public_universities: "Государственные университеты"
law_public_universities_desc: "Этот закон учреждает государственные университеты, обеспечивая всем гражданам доступ к высшему образованию. Он способствует академическому совершенству, исследованиям и инновациям и гарантирует, что образование не будет зависеть от социально-экономического положения."

