 law_coercive_pronatalism: "Принудительный пронатализм"
 law_coercive_pronatalism_desc: "Государство рассматривает материнство как долг перед нацией: пособия семьям и брачные займы поощряют многодетность, а безбрачие, контрацепция и бездетность облагаются налогами, подвергаются цензуре и наказываются.

Замедляет продвижение по [Concept('concept_demographic_stages','$concept_demographic_stages$')] на #negative_value -2#! очка в год на 5-м этапе, на #negative_value -3#! на 6-м и на #negative_value -4#! начиная с 7-го этапа."

