austrian_empire_collapse.18.t: "Распад Австрийской империи (отладка)"
austrian_empire_collapse.18.d: "Отладочное событие: запускает дневниковую запись о распаде Австрийской империи."
austrian_empire_collapse.18.a: "Начать дневниковую запись"
