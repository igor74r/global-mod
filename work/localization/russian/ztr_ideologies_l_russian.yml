l_russian:

ideology_neg_ambientalist: "Безответственный защитник окружающей среды"
ideology_neg_ambientalist_desc: "#lore Эта группа совершенно не заботится об окружающей среде, особенно если защита природы противоречит её экономическим интересам.#!"
ideology_moderate_ambientalist: "Умеренный защитник окружающей среды"
ideology_moderate_ambientalist_desc: "#lore Эта группа считает охрану окружающей среды важной задачей, но полагает, что её следует согласовывать с привычным образом жизни людей.#!"
ideology_extreme_ambientalist: "Радикальный защитник окружающей среды"
ideology_extreme_ambientalist_desc: "#lore Эта группа считает защиту окружающей среды важнейшей задачей, которая должна иметь приоритет над всеми остальными. Ради сохранения природы она выступает за радикальные преобразования общества.#!"
ideology_neoliberal_ambientalist: "Неолиберальный защитник окружающей среды"
ideology_neoliberal_ambientalist_desc: "#lore Эта группа полагает, что охраны природы можно добиться рыночными механизмами и умеренными мерами, а не государственным вмешательством, способным навредить бизнесу и экономике.#!"

ideology_extreme_traditionalist: "Радикальный традиционалист"
ideology_extreme_traditionalist_desc: "#lore Эта группа считает, что традиционные ценности и обычаи необходимо сохранять любой ценой, даже сопротивляясь переменам и модернизации. Она часто выступает против прогрессивных движений и призывает вернуться к общественным порядкам прошлого.#!"
ideology_moderate_traditionalist: "Умеренный традиционалист"
ideology_moderate_traditionalist_desc: "#lore Эта группа выступает за сохранение традиционных ценностей и обычаев, но допускает определённые перемены и модернизацию. Она стремится сочетать традиции с прогрессом, уважая историческое наследие и приспосабливаясь к современным потребностям.#!"
ideology_moderate_progressist: "Умеренный прогрессист"
ideology_moderate_progressist_desc: "#lore Эта группа выступает за постепенный прогресс и реформы, поддерживая социальные и экономические изменения, улучшающие общество без разрушения существующих институтов. Она стремится сочетать новаторство со стабильностью.#!"
ideology_extreme_progressist: "Радикальный прогрессист"
ideology_extreme_progressist_desc: "#lore Эта группа придерживается радикального взгляда на будущее и стремится упразднить существующие структуры власти, чтобы создать более справедливое общество посредством прямых действий и системных преобразований. Она поддерживает революционные идеи и бросает вызов существующему порядку.#!"
ideology_neoliberal_progressist: "Неолиберальный прогрессист"
ideology_neoliberal_progressist_desc: "#lore Эта группа считает прогресс важным для каждого человека, но полагает, что он не должен наносить ущерб бизнесу и экономике. Она выступает за инновации и экономический рост, которые приносят пользу всем гражданам.#!"
ideology_neoliberism: "Неолиберализм"
ideology_neoliberism_desc: "#lore Эта группа поддерживает капитализм свободного рынка, минимальное вмешательство государства и свободу личности. Она выступает за экономический рост и личную ответственность, против чрезмерного регулирования и масштабных программ социальной поддержки.#!"

ideology_modern_individualism: "Современный индивидуализм"
ideology_modern_individualism_desc: "#lore Классическое учение о самостоятельности личности возродилось в посткейнсианской социально-либеральной форме. Эта группа по-прежнему поддерживает частное предпринимательство, свободную торговлю и открытые рынки, но признаёт государство всеобщего благосостояния: пенсии, субсидии к заработной плате и высокий уровень грамотности больше не считаются угрозой промышленности, а воспринимаются как основа общества потребления, в котором работник одновременно является покупателем. Современные индивидуалисты считают, что достоинство личности лучше всего обеспечивают всеобщее благосостояние, социальная мобильность и свобода выбора, а не благотворительность или цеховые привилегии.#!"

ideology_bioethics_traditionalist: "Биоэтический консерватизм"
ideology_bioethics_traditionalist_desc: "#lore Эта группа считает жизнь священной от зачатия до естественной смерти, а семейные отношения и усыновление — обязанными следовать нравственному порядку, завещанному традицией.#!"
ideology_bioethics_progressist: "Биоэтический реформизм"
ideology_bioethics_progressist_desc: "#lore Эта группа считает, что медицина и закон должны служить свободе личного выбора, а государство не должно решать за людей вопросы рождения, семьи и конца жизни.#!"
ideology_education_traditionalist: "Образовательный консерватизм"
ideology_education_traditionalist_desc: "#lore Эта группа считает высшее образование привилегией немногих и полагает, что молодёжи следует работать в поле, мастерской или семейном предприятии, а не учиться в государственных школах.#!"
ideology_education_progressist: "Образовательный реформизм"
ideology_education_progressist_desc: "#lore Эта группа считает, что среднее и высшее государственное образование — двигатель национального прогресса, а учёба должна быть доступна каждому гражданину.#!"
ideology_democratic_socialist: "Демократический социалист"
ideology_democratic_socialist_desc: "#lore Этот лидер считает, что демократия остаётся незавершённой, пока не охватит рабочие места и систему социальной поддержки: всеобщая медицина, пенсии и бесплатные университеты, финансируемые прогрессивными налогами, а также передача ключевых отраслей в общую собственность. Всего этого следует добиваться на выборах, а не на баррикадах.#!"
ideology_neoliberal: "Неолиберал"
ideology_neoliberal_desc: "#lore Этот лидер считает, что рынки распределяют ресурсы эффективнее министерств: единые низкие налоги, свободное движение капитала и товаров, частное страхование вместо государственных монополий и ограничение влияния профсоюзов на экономику. Государство должно установить правила и не вмешиваться сверх необходимого.#!"
ideology_stalinist: "Сталинист"
ideology_stalinist_desc: "#lore Этот лидер считает, что социализм необходимо построить в одной стране и защищать любыми средствами: однопартийной системой, плановой экономикой, коллективизацией сельского хозяйства и бдительным аппаратом безопасности, выявляющим саботажников, священнослужителей и инакомыслящих.#!"
ideology_neofascist: "Неофашист"
ideology_neofascist_desc: "#lore Этот лидер облекает старую идеологию в новую форму: закрытые границы, нация, определяемая кровью и принадлежностью, развязанные руки полиции и борьба с нравственным упадком вседозволенного общества. Он говорит о порядке и идентичности, рассматривая демократию лишь как средство достижения цели.#!"
ZTRPOL_NATURAL_IG: "Естественная [concept_interest_group] для этой идеологии"
ideology_third_way: "Третий путь"
ideology_third_way_desc: "#lore Этот лидер считает, что старый спор между рынком и государством утратил смысл: свободная торговля и динамичный частный сектор должны сочетаться с государством всеобщего благосостояния, которое поощряет труд, инвестирует в образование и регулирует экономику, не национализируя её. Цель — равенство возможностей, а не результатов.#!"
ideology_green: "Зелёные"
ideology_green_desc: "#lore Этот лидер считает, что экономика не может расти бесконечно за счёт планеты, которая её поддерживает: загрязняющие окружающую среду шахты следует закрыть, повреждённые земли восстановить, от атомной энергетики отказаться, а демократию на местах распространить на все меньшинства, заботясь и о будущих поколениях.#!"
ideology_market_reformer: "Рыночный реформатор"
ideology_market_reformer_desc: "#lore Этот лидер придерживается принципа, что неважно, какого цвета кошка, лишь бы она ловила мышей: государство сохраняет политическую власть, но возвращает землю обрабатывающим её семьям, подчиняет фабрики рыночным механизмам и открывает границы для иностранного капитала и технологий.#!"
ideology_military_junta: "Военная хунта"
ideology_military_junta_desc: "#lore Этот лидер считает, что, когда политики терпят неудачу, вмешаться должны военные: выборы приостанавливаются до восстановления порядка, забастовки подавляются, газеты замолкают, а страна управляется как хорошо обученный полк. Военные обещают однажды вернуть власть гражданским, но редко сдерживают обещание.#!"
ideology_developmentalist: "Сторонник ускоренного развития"
ideology_developmentalist_desc: "#lore Этот лидер считает, что отсталая страна может догнать развитые державы только при сильной власти: пошлины должны защищать молодую промышленность, государство — направлять кредитование и использование природных ресурсов, школы и университеты — готовить инженеров, а профсоюзы — участвовать в общенациональном развитии.#!"
ideology_new_left: "Новые левые"
ideology_new_left_desc: "#lore Этот лидер считает, что освобождение не завершилось получением избирательных прав и зарплаты: поколение баррикад и сидячих протестов требует сексуальной свободы, отмены призыва и полицейской слежки, открытости ко всем культурам и права каждого человека самостоятельно распоряжаться своим телом.#!"
ideology_libertarian: "Либертарианец"
ideology_libertarian_desc: "#lore Этот лидер считает, что человек ничего не должен государству, кроме обязанности не мешать другим: низкие налоги, отсутствие пособий и цензуры, открытые границы, частная медицина и свобода жить, любить и умирать по собственному выбору.#!"
ideology_neoconservative: "Неоконсерватор"
ideology_neoconservative_desc: "#lore Этот лидер считает, что свободный рынок и традиционные ценности неразделимы и должны защищаться за рубежом профессиональной армией и мощнейшим арсеналом. Внутри страны — вера и семья, за её пределами — сила и решимость.#!"
ideology_tech_libertarian: "Технолибертарианец"
ideology_tech_libertarian_desc: "#lore Этот лидер считает, что технологии развиваются быстрее законов и не должны быть скованы регулированием: данные должны свободно циркулировать, цифровые платформы — оставаться нерегулируемыми, а профсоюзы и налоги — не препятствовать инновациям. Атомная энергетика должна обеспечивать энергией серверные фермы будущего.#!"
ideology_technocrat: "Технократ"
ideology_technocrat_desc: "#lore Этот лидер считает, что управление государством — инженерная, а не идеологическая задача: назначенные эксперты должны заменить партийных выдвиженцев, политика должна основываться на статистике, а школы и университеты — готовить администраторов будущего. В вопросах совести ему почти нечего сказать.#!"
ideology_maoist: "Маоист"
ideology_maoist_desc: "#lore Этот лидер считает, что революция совершается в деревне: крестьяне объединяются в коммуны, интеллигенцию отправляют учиться у народа, храмы и частные школы упраздняются, а единственная партия непрерывно очищает себя посредством классовой борьбы.#!"
ideology_reform_communist: "Реформист-коммунист"
ideology_reform_communist_desc: "#lore Этот лидер выступает за социализм с человеческим лицом: предприятия должны управляться советами трудящихся, тайная полиция — распущена, право на собрания и свободу слова — восстановлено, а партия должна добиваться поддержки, а не навязывать свою волю.#!"
ideology_democratizer: "Демократизатор"
ideology_democratizer_desc: "#lore Этот лидер считает, что эпоха единоличных правителей подходит к концу: необходимы свободные выборы и пресса, ликвидация политической полиции и переговоры между режимом и оппозицией о мирном переходе власти. Экономика может подождать — свобода нет.#!"
ideology_national_populist: "Национал-популист"
ideology_national_populist_desc: "#lore Этот лидер считает, что далёкие элиты предали народ: пошлины должны вернуть производство в страну, границы — закрыться для приезжих, пенсии — предоставляться только своим, полиция — получить больше полномочий, а пресса — знать своё место. Победив на выборах, такие лидеры начинают менять правила, позволившие им победить.#!"
 ZTRPOL_POLE_CORE: "Ядро своего идеологического полюса" # UPDATED
 ZTRPOL_OUTSIDE_POLE: "Оппозиция за пределами своего идеологического полюса" # UPDATED
 ideology_religious_democrat: "Религиозный демократ" # UPDATED
 ideology_religious_democrat_desc: "#lore Этот лидер считает, что религиозные убеждения должны присутствовать в общественной жизни: необходима социальная рыночная экономика, в которой профсоюзы и работодатели ведут диалог, щедрая поддержка семей, свобода преподавания веры в школах и строгие ограничения медицинского вмешательства в начале и конце жизни.#!" # UPDATED
 ideology_ztrpol_social_democratic_labor: "Социал-демократ"
 ideology_ztrpol_social_democratic_labor_desc: "#lore Эта группа стремится обуздать капитализм, а не уничтожить его: она выступает за сильные профсоюзы, развитую систему социальной поддержки и экономику, направляемую государством.#!"
 ideology_ztrpol_democratic_socialist: "Демократический социалист"
 ideology_ztrpol_democratic_socialist_desc: "#lore Эта группа стремится преодолеть капитализм парламентским путём, передав управление экономикой в руки самих трудящихся.#!"
 ideology_ztrpol_progressive_secular: "Светский прогрессист"
 ideology_ztrpol_progressive_secular_desc: "#lore Эта группа считает светское государство и всеобщее образование основой свободного и современного общества.#!"
 ideology_ztrpol_cooperativist: "Кооперативист"
 ideology_ztrpol_cooperativist_desc: "#lore Эта группа считает, что процветание сельской местности обеспечивают кооперативы и независимые фермеры при поддержке государства.#!"
 ideology_ztrpol_right_wing_populist_rural: "Сельский популист"
 ideology_ztrpol_right_wing_populist_rural_desc: "#lore Эта группа чувствует себя забытой далёкими элитами и мировыми рынками и требует защиты фермерских хозяйств, границ и традиционных общин.#!"
 ideology_ztrpol_right_wing_populist: "Правый популист"
 ideology_ztrpol_right_wing_populist_desc: "#lore Эта группа заявляет, что представляет интересы простых трудолюбивых людей в противостоянии элитам и приезжим, требуя строгого контроля границ и системы социальной поддержки только для граждан своей страны.#!"
 ideology_ztrpol_social_religious: "Социально-религиозный"
 ideology_ztrpol_social_religious_desc: "#lore Эта группа опирается на веру, требуя заботы о слабых: доступной медицины и образования для всех.#!"
 ideology_ztrpol_religious_democratic: "Религиозный демократ"
 ideology_ztrpol_religious_democratic_desc: "#lore Эта группа примирилась с демократией и свободой вероисповедания и стремится проводить религиозные ценности в общественную жизнь через выборы.#!"
 ideology_ztrpol_clerical_nationalist: "Клерикальный националист"
 ideology_ztrpol_clerical_nationalist_desc: "#lore Эта группа считает нацию и веру единым целым и хочет, чтобы государство защищало религию от разложения под влиянием секуляризма.#!"
 ideology_ztrpol_business_liberal: "Деловой либерал"
 ideology_ztrpol_business_liberal_desc: "#lore Эта группа принимает массовую демократию как цену стабильности при условии, что налоги останутся низкими, а частная собственность — неприкосновенной.#!"
 ideology_ztrpol_taxpayer: "Налогоплательщик"
 ideology_ztrpol_taxpayer_desc: "#lore Эта группа считает себя опорой нации, требует права голоса в управлении государством и сопротивляется налогам, наказывающим за усердный труд.#!"
 ideology_ztrpol_vanguard_labor: "Авангард рабочего класса"
 ideology_ztrpol_vanguard_labor_desc: "#lore Эта группа следует партийной линии: рабочее государство говорит от имени трудящихся через единственную партию, а профсоюзы служат проводниками её воли.#!"
 ideology_ztrpol_party_army: "Партийная армия"
 ideology_ztrpol_party_army_desc: "#lore Эта группа ставит партию выше нации и готова защищать революцию от внутренних врагов.#!"
 ideology_ztrpol_collective_farm: "Коллективное хозяйство"
 ideology_ztrpol_collective_farm_desc: "#lore Эта группа была организована в коллективные хозяйства и теперь зависит от плановой экономики в вопросах земли, орудий труда и сбыта продукции.#!"
 ideology_ztrpol_nomenklatura: "Номенклатура"
 ideology_ztrpol_nomenklatura_desc: "#lore Эта группа стала административным классом однопартийного государства, обменивая лояльность на карьеру и привилегии.#!"
 ideology_ztrpol_praetorian: "Преторианец"
 ideology_ztrpol_praetorian_desc: "#lore Эта группа считает себя хранителем порядка и готова взять власть непосредственно в свои руки, когда гражданские власти не справляются.#!"
 ideology_ztrpol_national_capitalist: "Национальный капиталист"
 ideology_ztrpol_national_capitalist_desc: "#lore Эта группа процветает при авторитарном государстве, которое защищает национальную промышленность, держит трудящихся в узде и не допускает выборов.#!"
 ideology_ztrpol_mass_nationalist: "Массовый националист"
 ideology_ztrpol_mass_nationalist_desc: "#lore Это движение дало группе чувство порядка и принадлежности к нации; поэтому она поддерживает единую партию, обещающую и то и другое.#!"
 ideology_ztrpol_socialist_vigilance: "Социалистическая бдительность"
 ideology_ztrpol_socialist_vigilance_desc: "#lore Эта группа считает, что бдительное государство — щит революции: досье, осведомители и камеры должны защищать завоевания трудящихся от врагов.#!"
 ideology_ztrpol_national_vigilance: "Национальная бдительность"
 ideology_ztrpol_national_vigilance_desc: "#lore Эта группа верит, что безопасность нации возможна лишь при постоянном надзоре: государство, знающее своих граждан, способно защитить веру, семью и общественный порядок.#!"
