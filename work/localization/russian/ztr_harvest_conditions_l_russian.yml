l_russian:
 ### Глобальное потепление — климатические условия урожая ###

 ztr_extreme_heatwave: "Экстремальная жара"
 ztr_extreme_heatwave_desc: "Недели непрерывной жары, невиданной прежде за всю историю местных наблюдений. Поля высыхают, скот гибнет под открытым небом, а тяжелее всего приходится городам: кирпич и асфальт удерживают тепло даже ночью, и число умерших среди пожилых и бедных растёт."
 ztr_megadrought: "Мегазасуха"
 ztr_megadrought_desc: "Это не засушливый сезон, а целое засушливое десятилетие. Уровень водохранилищ опускается ниже водозаборов, колодцы приходится раз за разом углублять, а ирригационные системы, построенные для более влажного климата, теперь проводят воду, которой больше нет. Стада распродают раньше срока, потому что пастбищам нечего предложить."
 ztr_hurricane: "Ураган"
 ztr_hurricane_desc: "Тропический циклон, который более тёплый океан направил на побережье. Он приходит за считаные дни, а последствия устраняют неделями: разрушены портовые сооружения, железнодорожные насыпи и прибрежные поселения. Из-за потепления морей ураганы чаще достигают суши и становятся разрушительнее."
 ztr_extreme_wildfire: "Гигантский лесной пожар"
 ztr_extreme_wildfire_desc: "Пожар таких масштабов невозможно потушить — от него можно только спасаться бегством. Высушенная засухой древесина и разогнанный жарой ветер несут огонь быстрее, чем успевают создавать противопожарные просеки, а дым перекрывает дороги и поражает лёгкие за сотни километров от очага."
 ztr_coastal_flooding: "Затопление побережья"

 ### Модификаторы смягчения последствий ###

