 state_harvest_condition_ztr_coastal_flooding_duration_mult_desc: "Увеличение или уменьшение продолжительности затопления побережья."

 modifier_cyclone_relief_desc: "Экстренное восстановление, предоставление убежища и помощь пострадавшим прибрежным районам временно увеличивают нагрузку на государственную казну."
 modifier_mega_flood_relief_desc: "Строительство и укрепление морских дамб требует чрезвычайно больших государственных расходов."

 ztr_coastal_flooding_desc: "Продолжительное затопление побережья на годы нарушает работу ферм, поселений и инфраструктуры. Солёная вода и повторяющиеся штормовые нагоны мешают быстрому восстановлению; экстренная помощь может уменьшить дальнейший ущерб, но не прекращает само бедствие." # UPDATED
