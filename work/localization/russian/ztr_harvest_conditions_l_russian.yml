 state_harvest_condition_ztr_hurricane_impact_mult_desc: "Увеличение или уменьшение воздействия ураганов."
 state_harvest_condition_ztr_hurricane_duration_mult: "Продолжительность условия урожая «[GetHarvestConditionType('ztr_hurricane').GetName]»"
 state_harvest_condition_ztr_hurricane_duration_mult_desc: "Увеличение или уменьшение продолжительности ураганов."
 state_harvest_condition_ztr_extreme_wildfire_impact_mult: "Влияние условия урожая «[GetHarvestConditionType('ztr_extreme_wildfire').GetName]»"
 state_harvest_condition_ztr_extreme_wildfire_impact_mult_desc: "Увеличение или уменьшение воздействия гигантских лесных пожаров."
 state_harvest_condition_ztr_extreme_wildfire_duration_mult: "Продолжительность условия урожая «[GetHarvestConditionType('ztr_extreme_wildfire').GetName]»"
 state_harvest_condition_ztr_extreme_wildfire_duration_mult_desc: "Увеличение или уменьшение продолжительности гигантских лесных пожаров."
