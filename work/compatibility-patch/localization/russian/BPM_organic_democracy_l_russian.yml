l_russian:
  law_organic_democracy: "Органическая демократия"
  law_organic_democracy_desc: "Различные традиционные «органы» общества — семья, рабочее место, муниципалитет или община — самостоятельно управляют своими делами и избирают представителей в законодательные органы. Политических партий и идеологических организаций не существует."
  ideology_dop_organic_democrat: "Сторонник органической демократии"
  ideology_dop_organic_democrat_desc: "#lore Эта группа выступает за органическую самоуправляемую демократию, основанную на общественных объединениях, с полной свободой передвижения и организации.#!"
  ig_national_conservatives_catholic: "Национал-консерваторы"
  ig_national_conservatives_catholic_desc: "Католические национал-консерваторы — неоднородная группа с разными названиями и взглядами, но в целом они придерживаются правого крыла католической мысли. Они выступают за демонтаж либеральных институтов в пользу органической демократии, органического государства и корпоративизма. Исторически это понятие охватывало широкий спектр движений: от португальских сторонников государственного корпоративизма Салазара и французского роялистского движения «Аксьон франсез» до итальянской пролетарской ANI, австрийских утопических «Социальных романтиков» и польских дистрибутистов «Млодзи Эндэцы»."
  je_bpm_clay_forming_an_organism: "Глина, принимающая форму организма"
  je_bpm_clay_forming_an_organism_reason: ""
  je_bpm_clay_forming_an_organism_status_consolidating_power: "Укрепление власти"
  concept_bpm_ig_is_organicist: "Органицисты"
  concept_bpm_ig_is_organicist_desc: "@ig_christian_democrats! #bold Христианские демократы#!, @ig_reactionaries! #bold Реакционеры#! и @ig_fascists! #bold Фашисты#! — [Concept('concept_interest_group', 'группы интересов')]. Они считают человеческое общество живым организмом, а отдельных людей — его клетками, и стремятся наделить эти клетки полномочиями внутри государства либо сделать их частью государства."
  concept_bpm_ig_is_organic_democrat: "Сторонник органической демократии"
  concept_bpm_ig_is_organic_democrat_desc: ""
  party_professionals_administration_urban: "Городские специалисты и администрация"
  party_trade_union_syndicates: "Профсоюзные синдикаты"
  party_rural_communes: "Сельские общины и деревни"
  party_national_organization: "Национальная организация"
