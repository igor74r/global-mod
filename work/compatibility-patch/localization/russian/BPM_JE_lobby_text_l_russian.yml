l_russian:
  je_bpm_modernizers_lobby: "#v Добавлено модом Better Politics#!\nГлядя на страны Европы и Америки, становится совершенно очевидно, что наши институты всё больше устаревают и становятся ненадёжными. Первыми это осознали интеллектуалы, среди которых сформировались два крыла, предлагающие противоположные взгляды на будущее: $bpm_je_all_modernizers_tt$ и $bpm_je_all_anti_modernizers_tt$."
