  je_tenpo_crisis_reason: "Эпоха Тэмпо, или «Эпоха небесного покровительства», начавшаяся в 1830 году, поначалу оправдывала своё благоприятное название. Однако плохая погода на [GetGeographicRegion('geographic_region_honshu').GetName] вскоре привела к резкому росту цен на рис и голоду по всей стране, а растущее влияние [Concept('concept_bpm_ig_is_liberal', '$ig_liberals$')] угрожает сложившемуся порядку [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName].\n\nТем временем западные [Concept('concept_great_power','$concept_great_powers$')] становятся всё смелее, а их торговые суда и канонерские лодки подходят всё ближе к нашим берегам.\n\nСтремясь решить эти проблемы, сторонники реформ изложили свои планы бакуфу.\n\n#tooltippable;tooltip:tenpo_reformer_tt #b Программа реформаторов#!#!:\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_edo_system_lax')] [ROOT.GetCountry.GetNameNoFlag] приняла [GetLawType('law_lax_edo_system').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_bureaucrats')] [ROOT.GetCountry.GetNameNoFlag] #b не#! приняла [GetLawType('law_hereditary_bureaucrats').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_urbanization')] В [ROOT.GetCountry.GetNameNoFlag] есть #v 3#! [Concept('concept_state', '$concept_states$')] с [GetBuildingType('building_urban_center').GetName] уровня #v 3#!\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_government')] Любая [concept_interest_group] [concept_bpm_ig_is_liberal] входит в [concept_in_government]\n#tooltippable;tooltip:tenpo_hardliner_tt #b Программа сторонников жёсткого курса#!#!:\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_edo_system_strict')] [ROOT.GetCountry.GetNameNoFlag] приняла [GetLawType('law_strict_edo_system').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_social_control')] [ROOT.GetCountry.GetNameNoFlag] приняла [GetLawType('law_shinsengumi').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_rural')] В [ROOT.GetCountry.GetNameNoFlag] есть #v 40#! уровней [GetBuildingType('building_rice_farm').GetName]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_liberals_marginalized')] Все [concept_interest_group] [concept_bpm_ig_is_liberal] являются [concept_marginalized]\n#tooltippable;tooltip:tenpo_shared_tt #b Общая программа#!#!:\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_famine')] Ни один [concept_state] — [concept_homeland] японской культуры [GetCulture('japanese').GetName] — не страдает от [concept_famine]\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_gdp')] [ROOT.GetCountry.GetNameNoFlag] имеет [Concept('concept_gdp', '$concept_gdp_short$')] не ниже @gdp!#v [Country.MakeScope.Var('tenpo_gdp_goal').GetValue|k0]#!\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_army_size')] [concept_power_projection] армии [ROOT.GetCountry.GetAdjectiveNoFlag] превышает #v 500#!\n• [SCOPE.GetRootScope.GetCountry.GetCustom('tenpo_checkbox_naval_size')] В наших [Concept('concept_state', '$concept_states$')] есть не менее #v 10#! уровней [GetBuildingType('building_naval_fortification').GetName]"
