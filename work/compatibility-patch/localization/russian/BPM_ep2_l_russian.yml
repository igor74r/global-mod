  hog_is_modernizer_or_mitogaku_tt: "У $bpm_hog_title_default_contextless$ есть [concept_ideology] [GetIdeology('ideology_modernizer_leader').GetName] или [GetIdeology('ideology_mitogaku').GetName]"
