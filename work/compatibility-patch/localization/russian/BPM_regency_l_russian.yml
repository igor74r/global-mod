l_russian:
  hog_regency.1.t: "Несовершеннолетний $bpm_hog_title_default_contextless$"
  hog_regency.1.d: "Титул $bpm_hog_title_default_contextless$ перешёл к [SCOPE.sCharacter('hog_scope').GetFullName], который ещё не достиг совершеннолетия. Выбор временно исполняющего обязанности $bpm_hog_title_default_contextless$ теперь возложен на действующее правительство."
  hog_regency.1.f: "«Ваша главная задача — поддерживать стабильность в стране [ROOT.GetCountry.GetNameNoFormatting] на протяжении всего периода несовершеннолетия $bpm_hog_title_default_contextless$. Мы готовы взять на себя воспитание ребёнка. Можете не сомневаться: вас не заставляют становиться ему приёмным родителем».\n\nПосланник замолчал, ожидая ответа министра.\n\n«Понимаю, — последовал ответ. — Что касается образования, [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] готово выделить необходимую сумму. Что ещё вам требуется?»"
  hog_regency.1.a: "[SCOPE.sCharacter('acting_hog_scope').GetFullName] возьмёт на себя обязанности правителя вместо юного $bpm_hog_title_default_contextless$."
  modifier_acting_hog: "Временно исполняющий обязанности главы правительства"
  modifier_acting_hog_landowners: "$modifier_acting_hog$"
  modifier_acting_hog_devout: "$modifier_acting_hog$"
  modifier_acting_hog_petty_bourgeoisie: "$modifier_acting_hog$"
  modifier_acting_hog_industrialists: "$modifier_acting_hog$"
  modifier_acting_hog_trade_unions: "$modifier_acting_hog$"
  modifier_acting_hog_intelligentsia: "$modifier_acting_hog$"
  modifier_acting_hog_armed_forces: "$modifier_acting_hog$"
  modifier_acting_hog_rural_folk: "$modifier_acting_hog$"
  modifier_acting_hog_conservatives: "$modifier_acting_hog$"
  modifier_acting_hog_reactionaries: "$modifier_acting_hog$"
  modifier_acting_hog_liberals: "$modifier_acting_hog$"
  modifier_acting_hog_radicals: "$modifier_acting_hog$"
  modifier_acting_hog_national_liberals: "$modifier_acting_hog$"
  modifier_acting_hog_market_liberals: "$modifier_acting_hog$"
  modifier_acting_hog_christian_democrats: "$modifier_acting_hog$"
  modifier_acting_hog_fascists: "$modifier_acting_hog$"
  modifier_acting_hog_agrarian_populists: "$modifier_acting_hog$"
  modifier_acting_hog_reformist_socialists: "$modifier_acting_hog$"
  modifier_acting_hog_socialists: "$modifier_acting_hog$"
  hog_regency.3.t: "Совершеннолетие $bpm_hog_title_default_contextless$"
  hog_regency.3.d: "[SCOPE.sCharacter('hog_scope').GetFullName] достиг совершеннолетия и теперь может стать $bpm_hog_title_default_contextless$. [SCOPE.sCharacter('acting_hog_scope').GetFullName] перестанет временно исполнять обязанности $bpm_hog_title_default_contextless$."
  hog_regency.3.f: "[SCOPE.sCharacter('acting_hog_scope').GetFullNameNoFormatting] наблюдал(а), как священник совершал последние помазания. Разница между сегодняшним и вчерашним $bpm_hog_title_default_contextless$ оказалась разительнее, чем [SCOPE.sCharacter('acting_hog_scope').GetSheHe] мог(ла) себе представить. [SCOPE.sCharacter('hog_scope').GetSheHe|U] стал(а) выше, а на лице появилось выражение решимости. Облачение казалось невесомым на плечах [SCOPE.sCharacter('hog_scope').GetHerHis].\n\nСвященник отступил, зазвучали фанфары, а за стенами дворца прогремели пушки.\n\n«Всё, что я здесь обещал(а), я исполню и буду хранить», — произнёс(ла) $bpm_hog_title_default_contextless$. «Да поможет мне [SCOPE.GetRootScope.GetCountry.GetCustom('GetDivinity')]»."
  hog_regency.3.a: "Да здравствует $bpm_hog_title_default_contextless$!"
  regency.1.a: "[SCOPE.sCharacter('regent_scope').GetFullName] возьмёт на себя обязанности правителя вместо юного [SCOPE.sCharacter('monarch_scope').GetPrimaryRoleTitle]."
