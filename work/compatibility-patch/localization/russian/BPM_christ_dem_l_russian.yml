l_russian:
  bpm_christian_democrats_events.1.t:0 "Католическая церковь воздерживается от поддержки кого-либо на выборах"
  bpm_christian_democrats_events.1.d:0 "Мы не станем участвовать в этой чёртовой затее."
  bpm_christian_democrats_events.1.f:0 "#lore 20. Итак, в соответствии с вашей пастырской заботой, усердно трудитесь ради защиты и сохранения этой веры. Не переставайте наставлять в ней всех людей, ободрять колеблющихся, убеждать несогласных и укреплять слабых в вере, никогда не терпя и не пропуская ничего, что могло бы хоть в малейшей степени осквернить чистоту этой веры. С той же твёрдостью духа укрепляйте единство всех людей с Католической церковью, вне которой нет спасения, а также их послушание этому Престолу Петра, на котором покоится всё здание нашей святейшей религии."
  bpm_christian_democrats_events.1.a:0 "Выборы — это кринж. Папа, вероятно (и совершенно серьёзно)"
